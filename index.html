<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเช็คชื่อวิชาวิทยาศาสตร์ - MyCheckin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500&display=swap');
        body { font-family: 'Kanit', sans-serif; background-color: #0f172a; color: white; }
        .sidebar-active { background: #4f46e5; border-right: 4px solid #fff; }
        @media print { .no-print { display: none; } .print-only { display: block !important; color: black; } body { background: white; color: black; } }
    </style>
</head>
<body class="flex min-h-screen">

    <!-- Sidebar เมนูชั้นเรียน ป.3-ป.6 -->
    <div class="w-64 bg-[#1e1b4b] shadow-xl no-print">
        <div class="p-6 text-xl font-bold border-b border-slate-700 flex items-center gap-2">
            <i class="fas fa-flask text-purple-400"></i> SCI-CHECK
        </div>
        <nav class="mt-6">
            <p class="px-6 text-xs text-slate-400 uppercase tracking-widest">ระดับชั้นที่สอน</p>
            <button onclick="changeGrade('ป.3')" id="btn-ป.3" class="w-full text-left px-6 py-4 hover:bg-slate-800 transition-all flex items-center gap-3">
                <i class="fas fa-graduation-cap"></i> ประถมศึกษาปีที่ 3
            </button>
            <button onclick="changeGrade('ป.4')" id="btn-ป.4" class="w-full text-left px-6 py-4 hover:bg-slate-800 transition-all flex items-center gap-3">
                <i class="fas fa-graduation-cap"></i> ประถมศึกษาปีที่ 4
            </button>
            <button onclick="changeGrade('ป.5')" id="btn-ป.5" class="w-full text-left px-6 py-4 hover:bg-slate-800 transition-all flex items-center gap-3 sidebar-active">
                <i class="fas fa-graduation-cap"></i> ประถมศึกษาปีที่ 5
            </button>
            <button onclick="changeGrade('ป.6')" id="btn-ป.6" class="w-full text-left px-6 py-4 hover:bg-slate-800 transition-all flex items-center gap-3">
                <i class="fas fa-graduation-cap"></i> ประถมศึกษาปีที่ 6
            </button>
        </nav>
    </div>

    <!-- Main Content -->
    <div class="flex-1 p-4 md:p-8 overflow-y-auto">
        
        <!-- Header & Date Picker -->
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8 no-print">
            <div>
                <h1 class="text-2xl font-bold text-white">เช็คเวลาเรียนวิชาวิทยาศาสตร์</h1>
                <p class="text-slate-400" id="displayGrade">ระดับชั้นประถมศึกษาปีที่ 5</p>
            </div>
            <div class="flex items-center gap-3 bg-slate-800 p-2 rounded-xl border border-slate-700">
                <i class="fas fa-calendar-alt text-purple-400 ml-2"></i>
                <input type="date" id="checkDate" class="bg-transparent border-none text-white focus:outline-none cursor-pointer">
                <button onclick="window.print()" class="bg-green-600 hover:bg-green-500 px-4 py-2 rounded-lg text-sm font-medium transition-all">
                    <i class="fas fa-print"></i> ปริ้นรายงาน
                </button>
            </div>
        </div>

        <!-- รายชื่อนักเรียน (Table Style เหมือน image_12.png) -->
        <div class="max-w-6xl mx-auto bg-white rounded-2xl overflow-hidden shadow-2xl text-slate-800">
            <table class="w-full text-left border-collapse">
                <thead class="bg-slate-100 border-b border-slate-200">
                    <tr>
                        <th class="p-4 font-bold text-sm">เลขที่</th>
                        <th class="p-4 font-bold text-sm">ชื่อ-นามสกุล</th>
                        <th class="p-4 font-bold text-sm text-center">สถานะการเข้าเรียน</th>
                    </tr>
                </thead>
                <tbody id="studentBody">
                    <!-- รายชื่อจะโผล่ตรงนี้ -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // *** วางรหัส Firebase ของคุณครูตรงนี้ ***
        const firebaseConfig = {
            apiKey: "AIzaSyCaAWoyfgWqBx8OiJLKuIOMmy602Y3cb9Q",
            authDomain: "mycheckin-ba316.firebaseapp.com",
            databaseURL: "https://mycheckin-ba316-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "mycheckin-ba316",
            storageBucket: "mycheckin-ba316.firebasestorage.app",
            messagingSenderId: "70860501032",
            appId: "1:70860501032:web:6cf057afbdd8330048451d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // ตั้งค่าวันที่ปัจจุบัน
        const dateInput = document.getElementById('checkDate');
        dateInput.valueAsDate = new Date();

        let currentGrade = "ป.5";

        // รายชื่อนักเรียนตัวอย่าง (คุณครูเพิ่ม/ลดเองได้ตรงนี้)
        const allStudents = {
            "ป.3": [{id: "301", name: "ด.ช.วิทยา เรียนดี"}, {id: "302", name: "ด.ญ.ใสใจ ธรรมะ"}],
            "ป.4": [{id: "401", name: "ด.ช.อดทน สู้ชีวิต"}, {id: "402", name: "ด.ญ.กอหญ้า น่ารัก"}],
            "ป.5": [
                {id: "501", name: "นายตั้งใจ เรียนดี"}, 
                {id: "502", name: "นายมั่งคั่ง ร่ำรวย"},
                {id: "503", name: "ด.ช.จิรพงศ์ โพธิโตตร"},
                {id: "504", name: "ด.ช.ธนโชติ สุขพรม"}
            ],
            "ป.6": [{id: "601", name: "นายเก่งกาจ ฉลาดล้ำ"}, {id: "602", name: "นางสาวมณี รักษ์โลก"}]
        };

        window.changeGrade = (grade) => {
            currentGrade = grade;
            document.getElementById('displayGrade').innerText = "ระดับชั้นประถมศึกษาปีที่ " + grade.replace('ป.', '');
            
            // เปลี่ยนสีเมนู
            ['ป.3', 'ป.4', 'ป.5', 'ป.6'].forEach(g => {
                document.getElementById('btn-'+g).classList.remove('sidebar-active');
            });
            document.getElementById('btn-'+grade).classList.add('sidebar-active');
            
            renderStudents();
        };

        function renderStudents() {
            const body = document.getElementById('studentBody');
            body.innerHTML = '';
            allStudents[currentGrade].forEach((std, index) => {
                const row = `
                    <tr class="border-b border-slate-100 hover:bg-slate-50 transition-all">
                        <td class="p-4 text-center w-16">${index + 1}</td>
                        <td class="p-4 font-medium">${std.name}</td>
                        <td class="p-4 text-center">
                            <div class="flex justify-center gap-2 no-print">
                                <button onclick="check('${std.id}', '${std.name}', 'มา')" class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-xs font-bold hover:bg-green-600 hover:text-white">มา</button>
                                <button onclick="check('${std.id}', 'สาย', 'สาย')" class="bg-yellow-100 text-yellow-700 px-3 py-1 rounded-full text-xs font-bold hover:bg-yellow-600 hover:text-white">สาย</button>
                                <button onclick="check('${std.id}', 'ขาด', 'ขาด')" class="bg-red-100 text-red-700 px-3 py-1 rounded-full text-xs font-bold hover:bg-red-600 hover:text-white">ขาด</button>
                            </div>
                            <div class="hidden print-only">....................</div>
                        </td>
                    </tr>
                `;
                body.innerHTML += row;
            });
        }

        window.check = (id, name, status) => {
            const date = document.getElementById('checkDate').value;
            set(ref(db, 'attendance/' + currentGrade + '/' + date + '/' + id), {
                name: name,
                status: status,
                time: new Date().toLocaleTimeString()
            }).then(() => {
                alert('บันทึก ' + name + ' : ' + status + ' สำเร็จ!');
            });
        };

        // เริ่มต้นโหลด ป.5
        renderStudents();
    </script>
</body>
</html>
