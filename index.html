<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเช็คชื่อวิชาวิทยาศาสตร์</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500&display=swap');
        body { font-family: 'Kanit', sans-serif; background-color: #f1f5f9; }
        .sidebar { background: #1e1b4b; color: white; }
    </style>
</head>
<body class="flex min-h-screen">

    <div class="w-64 sidebar no-print flex flex-col shadow-xl">
        <div class="p-6 text-2xl font-bold border-b border-indigo-900 flex items-center gap-2">
            <i class="fas fa-flask text-cyan-400"></i> SCI-CHECK
        </div>
        <nav class="flex-1 mt-6">
            <button onclick="changeGrade('ป.3')" id="btn-ป.3" class="grade-btn w-full text-left px-6 py-4 hover:bg-indigo-800 flex items-center gap-3 transition-all">ป.3</button>
            <button onclick="changeGrade('ป.4')" id="btn-ป.4" class="grade-btn w-full text-left px-6 py-4 hover:bg-indigo-800 flex items-center gap-3 transition-all">ป.4</button>
            <button onclick="changeGrade('ป.5')" id="btn-ป.5" class="grade-btn w-full text-left px-6 py-4 hover:bg-indigo-800 flex items-center gap-3 bg-indigo-700 transition-all">ป.5</button>
            <button onclick="changeGrade('ป.6')" id="btn-ป.6" class="grade-btn w-full text-left px-6 py-4 hover:bg-indigo-800 flex items-center gap-3 transition-all">ป.6</button>
        </nav>
    </div>

    <div class="flex-1 flex flex-col overflow-hidden">
        <header class="bg-white p-4 shadow-md flex justify-between items-center no-print border-b">
            <h2 class="text-xl font-bold text-indigo-900" id="titleGrade">ระดับชั้นประถมศึกษาปีที่ 5</h2>
            <div class="flex gap-2">
                <button onclick="document.getElementById('addStudentModal').classList.remove('hidden')" class="bg-indigo-600 text-white px-5 py-2 rounded-lg text-sm shadow hover:bg-indigo-700 transition-all">
                    <i class="fas fa-plus"></i> เพิ่มนักเรียน
                </button>
            </div>
        </header>

        <main class="flex-1 p-6 overflow-auto">
            <div class="bg-white rounded-xl shadow-lg p-6 min-w-[800px]">
                <table class="w-full border-collapse">
                    <thead class="bg-slate-50">
                        <tr>
                            <th class="border border-slate-300 p-2 w-16">เลขที่</th>
                            <th class="border border-slate-300 p-2 text-left">ชื่อ-นามสกุล</th>
                            <th class="border border-slate-300 p-2 w-24 text-center">จัดการ</th>
                        </tr>
                    </thead>
                    <tbody id="studentTableBody">
                        <tr><td colspan="3" class="p-10 text-center text-slate-400 italic">กำลังเชื่อมต่อฐานข้อมูล...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <div id="addStudentModal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl p-8 w-full max-w-sm shadow-2xl">
            <h3 class="font-bold text-xl mb-6 text-slate-800 border-b pb-2">เพิ่มนักเรียนใหม่</h3>
            <div class="space-y-4">
                <div>
                    <label class="text-sm font-medium text-slate-600">เลขที่</label>
                    <input type="number" id="newNo" class="w-full border p-2 rounded-lg text-slate-800 outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="text-sm font-medium text-slate-600">ชื่อ-นามสกุล</label>
                    <input type="text" id="newName" class="w-full border p-2 rounded-lg text-slate-800 outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="flex gap-2 pt-4">
                    <button id="saveBtn" class="flex-1 bg-indigo-600 text-white py-3 rounded-lg font-bold shadow-lg hover:bg-indigo-700 transition-all">บันทึกข้อมูล</button>
                    <button onclick="document.getElementById('addStudentModal').classList.add('hidden')" class="flex-1 bg-slate-100 py-3 rounded-lg font-bold text-slate-600 hover:bg-slate-200">ยกเลิก</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // รหัส Firebase ของคุณครู (จากภาพ image_4 และ image_17)
        const firebaseConfig = {
            apiKey: "AIzaSyCaAWoyfgWqBx8OiJLKuIOMmy602Y3cb9Q",
            authDomain: "mycheckin-ba316.firebaseapp.com",
            databaseURL: "https://mycheckin-ba316-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "mycheckin-ba316",
            storageBucket: "mycheckin-ba316.firebasestorage.app",
            messagingSenderId: "70860501032",
            appId: "1:70860501032:web:6cf057afbdd8330048451d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentGrade = 'ป.5';

        // ฟังก์ชันเปลี่ยนชั้นเรียน
        window.changeGrade = (grade) => {
            currentGrade = grade;
            document.querySelectorAll('.grade-btn').forEach(b => b.classList.remove('bg-indigo-700'));
            document.getElementById('btn-'+grade).classList.add('bg-indigo-700');
            document.getElementById('titleGrade').innerText = "ระดับชั้นประถมศึกษาปีที่ " + grade.replace('ป.', '');
            loadStudents();
        };

        // ฟังก์ชันบันทึกข้อมูล (เพิ่มระบบดักจับ Error)
        document.getElementById('saveBtn').addEventListener('click', async () => {
            const no = document.getElementById('newNo').value;
            const name = document.getElementById('newName').value;
            const btn = document.getElementById('saveBtn');

            if(!no || !name) {
                alert('กรุณากรอกทั้งเลขที่และชื่อนักเรียน');
                return;
            }

            btn.disabled = true;
            btn.innerText = 'กำลังบันทึก...';

            try {
                // คำสั่งบันทึกลง Firebase
                await set(ref(db, `students/${currentGrade}/${no}`), {
                    name: name
                });
                
                // ถ้าสำเร็จ
                alert('บันทึกข้อมูลเรียบร้อยแล้ว');
                document.getElementById('newNo').value = '';
                document.getElementById('newName').value = '';
                document.getElementById('addStudentModal').classList.add('hidden');
                
            } catch (error) {
                // ถ้าไม่สำเร็จ จะเด้งบอกสาเหตุ
                console.error(error);
                alert('บันทึกไม่สำเร็จ! สาเหตุ: ' + error.message + '\n\nกรุณาเช็คหน้า Rules ใน Firebase ว่าเป็น true หรือยัง');
            } finally {
                btn.disabled = false;
                btn.innerText = 'บันทึกข้อมูล';
            }
        });

        // ฟังก์ชันลบข้อมูล
        window.deleteStudent = (no) => {
            if(confirm('คุณต้องการลบรายชื่อนักเรียนเลขที่ ' + no + ' ใช่หรือไม่?')) {
                remove(ref(db, `students/${currentGrade}/${no}`))
                    .catch(e => alert('ลบไม่ได้: ' + e.message));
            }
        };

        // โหลดข้อมูลแบบเรียลไทม์
        function loadStudents() {
            const tbody = document.getElementById('studentTableBody');
            onValue(ref(db, `students/${currentGrade}`), (snapshot) => {
                const data = snapshot.val();
                tbody.innerHTML = '';
                
                if(data) {
                    Object.keys(data).sort((a, b) => a - b).forEach(no => {
                        tbody.innerHTML += `
                            <tr class="border-b border-slate-200 hover:bg-indigo-50 transition-all">
                                <td class="p-3 text-center border-r font-bold text-indigo-900">${no}</td>
                                <td class="p-3 text-slate-700">${data[no].name}</td>
                                <td class="p-3 text-center">
                                    <button onclick="deleteStudent('${no}')" class="text-red-400 hover:text-red-600 transition-all">
                                        <i class="fas fa-trash-alt"></i>
                                    </button>
                                </td>
                            </tr>
                        `;
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="3" class="p-10 text-center text-slate-400 italic">ยังไม่มีข้อมูลรายชื่อในชั้นนี้</td></tr>';
                }
            }, (error) => {
                alert('โหลดข้อมูลไม่ได้! กรุณาเช็ค Firebase Rules: ' + error.message);
            });
        }

        // เริ่มงาน
        loadStudents();
    </script>
</body>
</html>
