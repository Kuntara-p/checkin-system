<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเช็คชื่อนักเรียน - MyCheckin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500&display=swap');
        body { font-family: 'Kanit', sans-serif; }
    </style>
</head>
<body class="bg-[#1a1c2e] text-white min-h-screen p-4 md:p-10">

    <div class="max-w-6xl mx-auto bg-gradient-to-r from-purple-600 to-indigo-700 rounded-3xl p-8 mb-10 shadow-2xl">
        <div class="flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold text-white mb-2">รายวิชาคอมพิวเตอร์กราฟิก</h1>
                <p class="opacity-80 text-lg">ประจำวันที่ <span id="currentDate" class="font-medium text-yellow-300"></span></p>
            </div>
            <div class="text-right hidden md:block">
                <div class="text-sm opacity-70">สถานะระบบ</div>
                <div class="flex items-center gap-2 text-green-400">
                    <span class="relative flex h-3 w-3">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
                    </span>
                    Online
                </div>
            </div>
        </div>
    </div>

    <div id="studentList" class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <p class="text-center col-span-full opacity-50">กำลังเชื่อมต่อฐานข้อมูล...</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // รหัส Config ของคุณที่เรียบเรียงใหม่
        const firebaseConfig = {
            apiKey: "AIzaSyCAaWoYfgWqBx0OiJlKuIOMmy6O2Y3cb9Q",
            authDomain: "mycheckin-ba316.firebaseapp.com",
            projectId: "mycheckin-ba316",
            storageBucket: "mycheckin-ba316.firebasestorage.app",
            messagingSenderId: "70860501032",
            appId: "1:70860501032:web:6cf057afbdd8330048451d",
            measurementId: "G-34YNM7B1N0",
            databaseURL: "https://mycheckin-ba316-default-rtdb.asia-southeast1.firebasedatabase.app"
        };

        // เริ่มต้นการทำงาน Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // แสดงวันที่ปัจจุบัน
        document.getElementById('currentDate').innerText = new Date().toLocaleDateString('th-TH', {
            year: 'numeric', month: 'long', day: 'numeric'
        });

        // ข้อมูลนักเรียน (คุณสามารถเพิ่ม/ลด รายชื่อตรงนี้ได้เลย)
        const students = [
            { id: "001", name: "เด็กชาย ขนกานต์ รุ่งเรือง" },
            { id: "002", name: "เด็กชาย ณัฐวุฒิ เจริญสุข" },
            { id: "003", name: "เด็กชาย ภานุพงศ์ ใจดี" },
            { id: "004", name: "เด็กชาย ภูริภัทร พิทักษ์" }
        ];

        // ฟังก์ชันสร้างการ์ดรายชื่อนักเรียน
        const renderStudents = () => {
            const listDiv = document.getElementById('studentList');
            listDiv.innerHTML = ''; 

            students.forEach(std => {
                const card = document.createElement('div');
                card.className = "bg-[#252841] border border-gray-700 rounded-2xl p-6 hover:shadow-xl hover:border-purple-500 transition-all duration-300";
                card.innerHTML = `
                    <div class="flex items-center gap-4 mb-6">
                        <div class="w-14 h-14 bg-gradient-to-br from-purple-500 to-indigo-600 rounded-full flex items-center justify-center text-xl font-bold text-white shadow-lg">
                            ${std.name.split(' ')[1].charAt(0)}
                        </div>
                        <div>
                            <h3 class="text-lg font-semibold text-white">${std.name}</h3>
                            <p class="text-gray-400 text-sm italic">ID: ${std.id}</p>
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="checkIn('${std.id}', '${std.name}', 'มา')" class="flex-1 bg-green-600/20 text-green-400 border border-green-600/30 hover:bg-green-600 hover:text-white py-2 rounded-xl text-sm font-medium transition-all">มา</button>
                        <button onclick="checkIn('${std.id}', '${std.name}', 'สาย')" class="flex-1 bg-yellow-600/20 text-yellow-400 border border-yellow-600/30 hover:bg-yellow-600 hover:text-white py-2 rounded-xl text-sm font-medium transition-all">สาย</button>
                        <button onclick="checkIn('${std.id}', '${std.name}', 'ขาด')" class="flex-1 bg-red-600/20 text-red-400 border border-red-600/30 hover:bg-red-600 hover:text-white py-2 rounded-xl text-sm font-medium transition-all">ขาด</button>
                    </div>
                `;
                listDiv.appendChild(card);
            });
        };

        // ฟังก์ชันส่งข้อมูลไปยัง Firebase
        window.checkIn = (id, name, status) => {
            const today = new Date().toISOString().split('T')[0]; // รูปแบบ YYYY-MM-DD
            const logRef = ref(db, 'attendance/' + today + '/' + id);
            
            set(logRef, {
                name: name,
                status: status,
                timestamp: new Date().toLocaleTimeString('th-TH')
            })
            .then(() => {
                // แสดงการแจ้งเตือนแบบเล็กๆ ไม่ขัดจังหวะ
                console.log('บันทึกสำเร็จ');
                alert(`✅ บันทึกคุณ ${name}: ${status}`);
            })
            .catch((error) => {
                console.error('เกิดข้อผิดพลาด:', error);
                alert('❌ บันทึกไม่สำเร็จ โปรดตรวจสอบการตั้งค่า Firebase');
            });
        };

        renderStudents();
    </script>
</body>
</html>
