            <input type="password" id="password" placeholder="รหัสผ่าน" class="w-full bg-[#1a1c2e] border border-gray-600 rounded-xl p-3 mb-6 text-white">
            <button onclick="handleLogin()" class="w-full bg-purple-600 hover:bg-purple-500 py-3 rounded-xl font-bold transition-all shadow-lg shadow-purple-500/20">เข้าสู่ระบบ</button>
            <p id="loginError" class="text-red-400 mt-4 text-sm hidden">อีเมลหรือรหัสผ่านไม่ถูกต้อง</p>

    </div>

    <div id="mainPage" class="hidden">

                </div>
                <button onclick="handleLogout()" class="bg-red-500/20 hover:bg-red-500 text-red-100 px-6 py-2 rounded-full transition-all border border-red-500/50">

                </button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-10">
                <div class="bg-[#252841] p-6 rounded-2xl border border-gray-700">
                    <h3 class="mb-4 text-purple-400 font-medium"><i class="fas fa-calendar-day mr-2"></i>วันที่ต้องการเช็คชื่อ</h3>
                    <input type="date" id="checkDate" class="w-full bg-[#1a1c2e] border border-gray-600 rounded-xl p-3 text-white focus:border-purple-500 outline-none">
                </div>
                <div class="bg-[#252841] p-6 rounded-2xl border border-gray-700">
                    <h3 class="mb-4 text-green-400 font-medium"><i class="fas fa-user-plus mr-2"></i>เพิ่มนักเรียนใหม่</h3>
                    <div class="flex gap-2">
                        <input type="text" id="stdId" placeholder="รหัส" class="w-1/4 bg-[#1a1c2e] border border-gray-600 rounded-xl p-2 text-white outline-none">
                        <input type="text" id="stdName" placeholder="ชื่อ-นามสกุล" class="flex-1 bg-[#1a1c2e] border border-gray-600 rounded-xl p-2 text-white outline-none">
                        <button onclick="addStudent()" class="bg-green-600 hover:bg-green-500 px-6 rounded-xl transition-all shadow-lg shadow-green-600/20"><i class="fas fa-plus"></i></button>
                    </div>
                </div>
            </div>

            <div id="studentGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                </div>
        </div>
    </div>
