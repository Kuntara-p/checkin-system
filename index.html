<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเช็คชื่อวิชาวิทยาศาสตร์ (แบบละเอียด)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500&display=swap');
        body { font-family: 'Kanit', sans-serif; background-color: #f1f5f9; color: #1e293b; }
        .holiday { background-color: #fee2e2 !important; color: #dc2626; font-weight: bold; }
        .weekend { background-color: #f8fafc; color: #94a3b8; }
        .sidebar { background: #1e1b4b; color: white; transition: all 0.3s; }
        @media print { 
            .no-print { display: none !important; } 
            body { background: white; padding: 0; }
            table { font-size: 10px; border: 1px solid black !important; width: 100%; }
            th, td { border: 1px solid black !important; padding: 2px !important; color: black !important; }
        }
    </style>
</head>
<body class="flex min-h-screen">

    <div class="w-64 sidebar shadow-2xl no-print flex flex-col">
        <div class="p-6 text-2xl font-bold border-b border-indigo-900 flex items-center gap-2">
            <i class="fas fa-flask text-cyan-400"></i> SCI-SYSTEM
        </div>
        <nav class="flex-1 mt-6">
            <p class="px-6 text-[10px] text-indigo-300 uppercase font-bold mb-4">ระดับชั้นที่สอน</p>
            <button onclick="changeGrade('ป.3')" id="btn-ป.3" class="grade-btn w-full text-left px-6 py-4 hover:bg-indigo-800 flex items-center gap-3">ป.3</button>
            <button onclick="changeGrade('ป.4')" id="btn-ป.4" class="grade-btn w-full text-left px-6 py-4 hover:bg-indigo-800 flex items-center gap-3">ป.4</button>
            <button onclick="changeGrade('ป.5')" id="btn-ป.5" class="grade-btn w-full text-left px-6 py-4 hover:bg-indigo-800 flex items-center gap-3 bg-indigo-700">ป.5</button>
            <button onclick="changeGrade('ป.6')" id="btn-ป.6" class="grade-btn w-full text-left px-6 py-4 hover:bg-indigo-800 flex items-center gap-3">ป.6</button>
        </nav>
    </div>

    <div class="flex-1 flex flex-col overflow-hidden">
        <header class="bg-white p-4 shadow-sm flex justify-between items-center no-print border-b">
            <div class="flex items-center gap-4">
                <h2 class="text-xl font-bold text-indigo-900" id="titleGrade">ประถมศึกษาปีที่ 5</h2>
                <input type="month" id="selectMonth" class="bg-slate-100 border rounded-lg px-3 py-1 text-sm">
            </div>
            <div class="flex gap-2">
                <button onclick="toggleModal('addStudentModal')" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm"><i class="fas fa-plus"></i> เพิ่มนักเรียน</button>
                <button onclick="window.print()" class="bg-slate-800 text-white px-4 py-2 rounded-lg text-sm"><i class="fas fa-print"></i> พิมพ์รายงาน</button>
            </div>
        </header>

        <main class="flex-1 p-6 overflow-auto">
            <div class="bg-white rounded-xl shadow-lg p-6 min-w-[1200px]">
                <div class="text-center mb-6">
                    <h3 class="text-xl font-bold">บัญชีลงเวลาเรียนวิชาวิทยาศาสตร์</h3>
                    <p class="text-sm text-slate-500" id="reportInfo">ชั้นเรียนที่เลือกประจำเดือน</p>
                </div>
                <table class="w-full border-collapse border border-slate-300 text-[11px]">
                    <thead class="bg-slate-50">
                        <tr>
                            <th rowspan="2" class="border border-slate-300 p-1 w-8">เลขที่</th>
                            <th rowspan="2" class="border border-slate-300 p-1 w-40 text-left">ชื่อ-นามสกุล</th>
                            <th colspan="31" class="border border-slate-300 p-1 text-center bg-indigo-50">วันที่</th>
                            <th colspan="6" class="border border-slate-300 p-1 text-center bg-slate-100">สรุป (ครั้ง)</th>
                        </tr>
                        <tr id="daysHeader"></tr>
                    </thead>
                    <tbody id="attendanceTable"></tbody>
                </table>
            </div>
        </main>
    </div>

    <div id="addStudentModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 no-print">
        <div class="bg-white rounded-xl p-6 w-full max-w-sm">
            <h3 class="font-bold mb-4">เพิ่มรายชื่อนักเรียน</h3>
            <input type="number" id="newNo" placeholder="เลขที่" class="w-full border p-2 mb-2 rounded">
            <input type="text" id="newName" placeholder="ชื่อ-นามสกุล" class="w-full border p-2 mb-4 rounded">
            <div class="flex gap-2">
                <button onclick="saveStudent()" class="flex-1 bg-indigo-600 text-white py-2 rounded">บันทึก</button>
                <button onclick="toggleModal('addStudentModal')" class="flex-1 bg-gray-200 py-2 rounded">ยกเลิก</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCaAWoyfgWqBx8OiJLKuIOMmy602Y3cb9Q",
            authDomain: "mycheckin-ba316.firebaseapp.com",
            databaseURL: "https://mycheckin-ba316-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "mycheckin-ba316",
            storageBucket: "mycheckin-ba316.firebasestorage.app",
            messagingSenderId: "70860501032",
            appId: "1:70860501032:web:6cf057afbdd8330048451d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentGrade = 'ป.5';
        const monthInput = document.getElementById('selectMonth');
        const now = new Date();
        monthInput.value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;

        window.toggleModal = (id) => document.getElementById(id).classList.toggle('hidden');

        window.changeGrade = (grade) => {
            currentGrade = grade;
            document.querySelectorAll('.grade-btn').forEach(b => b.classList.remove('bg-indigo-700'));
            document.getElementById('btn-'+grade).classList.add('bg-indigo-700');
            document.getElementById('titleGrade').innerText = "ประถมศึกษาปีที่ " + grade.replace('ป.', '');
            loadData();
        };

        window.saveStudent = () => {
            const no = document.getElementById('newNo').value;
            const name = document.getElementById('newName').value;
            if(no && name) {
                set(ref(db, `students/${currentGrade}/${no}`), { name }).then(() => {
                    toggleModal('addStudentModal');
                    loadData();
                });
            }
        };

        window.deleteStudent = (no) => {
            if(confirm('ลบนักเรียนเลขที่ ' + no + '?')) {
                remove(ref(db, `students/${currentGrade}/${no}`)).then(() => loadData());
            }
        };

        window.check = (no, day) => {
            const monthStr = monthInput.value;
            const dateStr = `${monthStr}-${String(day).padStart(2, '0')}`;
            const status = prompt("ระบุสถานะ (มา, สาย, ขาด, ป่วย, ลา) หรือปล่อยว่างเพื่อลบ:", "มา");
            if(status === null) return;
            if(status === "") {
                remove(ref(db, `attendance/${currentGrade}/${dateStr}/${no}`));
            } else {
                set(ref(db, `attendance/${currentGrade}/${dateStr}/${no}`), { status });
            }
            loadData();
        };

        function loadData() {
            onValue(ref(db, `students/${currentGrade}`), (snap) => {
                const students = snap.val() || {};
                onValue(ref(db, `attendance/${currentGrade}`), (attnSnap) => {
                    renderTable(students, attnSnap.val() || {});
                });
            });
        }

        function renderTable(students, attendance) {
            const [year, month] = monthInput.value.split('-').map(Number);
            const daysInMonth = new Date(year, month, 0).getDate();
            
            const header = document.getElementById('daysHeader');
            header.innerHTML = '';
            for(let i=1; i<=31; i++) {
                header.innerHTML += `<th class="border border-slate-300 w-6 ${i > daysInMonth ? 'bg-gray-200' : ''}">${i}</th>`;
            }
            ['ป่วย','ขาด','ลา','สาย','มา','%'].forEach(h => header.innerHTML += `<th class="border border-slate-300 w-7 bg-indigo-100">${h}</th>`);

            const tbody = document.getElementById('attendanceTable');
            tbody.innerHTML = '';

            Object.keys(students).sort((a,b)=>a-b).forEach(no => {
                let stats = { ป่วย:0, ขาด:0, ลา:0, สาย:0, มา:0 };
                let row = `<tr class="hover:bg-slate-50">
                    <td class="border border-slate-300 text-center p-1">${no}</td>
                    <td class="border border-slate-300 p-1 font-medium flex justify-between group">
                        ${students[no].name} 
                        <i onclick="deleteStudent(${no})" class="fas fa-trash text-red-300 opacity-0 group-hover:opacity-100 cursor-pointer no-print"></i>
                    </td>`;
                
                for(let d=1; d<=31; d++) {
                    const dateStr = `${monthInput.value}-${String(d).padStart(2, '0')}`;
                    const dayDate = new Date(year, month-1, d);
                    const isWeekend = d <= daysInMonth && (dayDate.getDay()===0 || dayDate.getDay()===6);
                    const status = attendance[dateStr] && attendance[dateStr][no] ? attendance[dateStr][no].status : '';
                    if(status) stats[status]++;
                    
                    row += `<td onclick="check(${no}, ${d})" class="border border-slate-300 text-center cursor-pointer ${isWeekend ? 'weekend' : ''}">
                        ${status === 'มา' ? '/' : status}
                    </td>`;
                }

                const total = stats.มา + stats.สาย + stats.ขาด + stats.ป่วย + stats.ลา;
                const percent = total > 0 ? Math.round((stats.มา / total) * 100) : 0;

                row += `<td class="border border-slate-300 text-center bg-gray-50">${stats.ป่วย}</td>
                        <td class="border border-slate-300 text-center bg-gray-50">${stats.ขาด}</td>
                        <td class="border border-slate-300 text-center bg-gray-50">${stats.ลา}</td>
                        <td class="border border-slate-300 text-center bg-gray-50">${stats.สาย}</td>
                        <td class="border border-slate-300 text-center bg-green-50 font-bold">${stats.มา}</td>
                        <td class="border border-slate-300 text-center bg-indigo-50 font-bold">${percent}%</td></tr>`;
                tbody.innerHTML += row;
            });
        }

        monthInput.onchange = loadData;
        loadData();
    </script>
</body>
</html>
