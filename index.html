<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเช็คชื่อนักเรียน - MyCheckIn</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #1a1c2e; color: white; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="loginPage" class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-[#252841] p-8 rounded-3xl shadow-2xl w-full max-w-md border border-gray-700">
            <div class="text-center mb-8">
                <i class="fas fa-user-shield text-5xl text-indigo-500 mb-4"></i>
                <h1 class="text-2xl font-bold">เข้าสู่ระบบเช็คชื่อ</h1>
            </div>
            <div class="space-y-4">
                <input type="email" id="email" placeholder="อีเมลของคุณครู" class="w-full bg-[#1a1c2e] border border-gray-600 rounded-xl p-3 focus:outline-none focus:border-indigo-500 transition-all text-white">
                <input type="password" id="password" placeholder="รหัสผ่าน" class="w-full bg-[#1a1c2e] border border-gray-600 rounded-xl p-3 focus:outline-none focus:border-indigo-500 transition-all text-white">
                <p id="loginError" class="text-red-400 text-sm hidden"></p>
                <button onclick="handleLogin()" class="w-full bg-indigo-600 hover:bg-indigo-500 py-3 rounded-xl font-bold transition-all shadow-lg text-white">เข้าสู่ระบบ</button>
            </div>
        </div>
    </div>

    <div id="mainPage" class="hidden min-h-screen p-4 md:p-10">
        <div class="max-w-6xl mx-auto flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-purple-400">ระบบเช็คชื่อนักเรียน</h1>
                <p class="text-gray-400">จัดการข้อมูลและเช็คชื่อแบบ Real-time</p>
            </div>
            <button onclick="handleLogout()" class="bg-red-500/10 text-red-400 border border-red-500/50 px-4 py-2 rounded-xl hover:bg-red-500 hover:text-white transition-all">
                <i class="fas fa-sign-out-alt"></i> ออกจากระบบ
            </button>
        </div>

        <div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-6 mb-10">
            <div class="bg-[#252841] p-6 rounded-2xl border border-gray-700">
                <h3 class="mb-4 text-indigo-400 font-medium"><i class="fas fa-calendar-alt"></i> 1. เลือกวันที่เช็คชื่อ</h3>
                <input type="date" id="checkDate" class="w-full bg-[#1a1c2e] border border-gray-600 rounded-xl p-3 text-white">
            </div>
            <div class="bg-[#252841] p-6 rounded-2xl border border-gray-700">
                <h3 class="mb-4 text-indigo-400 font-medium"><i class="fas fa-user-plus"></i> 2. เพิ่มนักเรียนใหม่</h3>
                <div class="flex gap-2">
                    <input type="text" id="stdId" placeholder="รหัส" class="w-24 bg-[#1a1c2e] border border-gray-600 rounded-xl p-3 text-white">
                    <input type="text" id="stdName" placeholder="ชื่อ-นามสกุล" class="flex-1 bg-[#1a1c2e] border border-gray-600 rounded-xl p-3 text-white">
                    <button onclick="addStudent()" class="bg-indigo-600 px-4 rounded-xl hover:bg-indigo-500 transition-all text-white"><i class="fas fa-plus"></i></button>
                </div>
            </div>
        </div>

        <div id="studentGrid" class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCAaWoYfgWqBx8O1JlKuiOMmy6O2Y3cb9Q",
            authDomain: "mycheckin-ba316.firebaseapp.com",
            databaseURL: "https://mycheckin-ba316-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "mycheckin-ba316",
            storageBucket: "mycheckin-ba316.firebasestorage.app",
            messagingSenderId: "70860501032",
            appId: "1:70860501032:web:6cf057afbdd8330848451d",
            measurementId: "G-34YNM7B1N0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('loginPage').classList.add('hidden');
                document.getElementById('mainPage').classList.remove('hidden');
                loadStudents();
            } else {
                document.getElementById('loginPage').classList.remove('hidden');
                document.getElementById('mainPage').classList.add('hidden');
            }
        });

        window.handleLogin = async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('loginError');
            try {
                await signInWithEmailAndPassword(auth, email, password);
                errorMsg.classList.add('hidden');
            } catch (error) {
                errorMsg.innerText = "อีเมลหรือรหัสผ่านไม่ถูกต้อง";
                errorMsg.classList.remove('hidden');
            }
        };

        window.handleLogout = () => signOut(auth);

        window.addStudent = () => {
            const id = document.getElementById('stdId').value;
            const name = document.getElementById('stdName').value;
            if (id && name) {
                set(ref(db, 'students/' + id), { name: name }).then(() => {
                    document.getElementById('stdId').value = '';
                    document.getElementById('stdName').value = '';
                });
            } else { alert("กรุณากรอกรหัสและชื่อนักเรียน"); }
        };

        window.deleteStudent = (id) => {
            if (confirm('ยืนยันการลบนักเรียนรหัส ' + id + '?')) {
                remove(ref(db, 'students/' + id));
            }
        };

        window.checkAttendance = (id, name, status) => {
            const date = document.getElementById('checkDate').value;
            if (!date) return alert("กรุณาเลือกวันที่");
            set(ref(db, 'attendance/' + date + '/' + id), {
                name: name,
                status: status,
                timestamp: new Date().toLocaleTimeString()
            }).then(() => { alert("บันทึก " + name + " (" + status + ") เรียบร้อย"); });
        };

        function loadStudents() {
            onValue(ref(db, 'students'), (snapshot) => {
                const grid = document.getElementById('studentGrid');
                grid.innerHTML = '';
                const data = snapshot.val();
                if (data) {
                    Object.keys(data).forEach(id => {
                        const std = data[id];
                        grid.innerHTML += `
                            <div class="bg-[#252841] border border-gray-700 rounded-2xl p-6 relative shadow-lg">
                                <button onclick="deleteStudent('${id}')" class="absolute top-4 right-4 text-gray-500 hover:text-red-400 transition-all">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                                <div class="flex items-center gap-4 mb-6">
                                    <div class="w-12 h-12 bg-indigo-500 rounded-full flex items-center justify-center font-bold text-xl">
                                        ${std.name.charAt(0)}
                                    </div>
                                    <div>
                                        <h3 class="font-bold text-lg">${std.name}</h3>
                                        <p class="text-sm text-gray-400">ID: ${id}</p>
                                    </div>
                                </div>
                                <div class="flex gap-2">
                                    <button onclick="checkAttendance('${id}', '${std.name}', 'มา')" class="flex-1 bg-green-600/10 text-green-400 border border-green-600/30 py-2 rounded-xl hover:bg-green-600 hover:text-white transition-all font-medium">มา</button>
                                    <button onclick="checkAttendance('${id}', '${std.name}', 'สาย')" class="flex-1 bg-yellow-600/10 text-yellow-400 border border-yellow-600/30 py-2 rounded-xl hover:bg-yellow-600 hover:text-white transition-all font-medium">สาย</button>
                                    <button onclick="checkAttendance('${id}', '${std.name}', 'ขาด')" class="flex-1 bg-red-600/10 text-red-400 border border-red-600/30 py-2 rounded-xl hover:bg-red-600 hover:text-white transition-all font-medium">ขาด</button>
                                </div>
                            </div>`;
                    });
                } else {
                    grid.innerHTML = '<p class="col-span-full text-center text-gray-500 py-10">ยังไม่มีรายชื่อนักเรียน กรุณาเพิ่มนักเรียนด้านบน</p>';
                }
            });
        }
        document.getElementById('checkDate').valueAsDate = new Date();
    </script>
</body>
</html>
