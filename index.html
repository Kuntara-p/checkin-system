<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCIENCE SMART SYSTEM - BAN KHUAN NIANG SCHOOL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Sarabun', sans-serif; background-color: #f0fdf4; }
        
        /* สไตล์ตารางรายงานสำหรับการพิมพ์ */
        .report-table { border-collapse: collapse; width: 100%; table-layout: fixed; font-size: 10px; border: 1px solid black; }
        .report-table th, .report-table td { border: 1px solid black; padding: 2px 0; text-align: center; height: 20px; }
        .day-col { width: 22px !important; }
        .no-col { width: 35px !important; }
        .name-col { width: 180px !important; text-align: left !important; padding-left: 5px !important; }
        
        /* ช่องวันหยุดสีทึบสำหรับการพิมพ์ */
        .holiday-cell { background-color: #333 !important; -webkit-print-color-adjust: exact; }
        
        @media print {
            .no-print { display: none !important; }
            body { background: white; padding: 0; margin: 0; }
            .print-area { display: block !important; width: 297mm; padding: 10mm; }
            @page { size: A4 landscape; margin: 5mm; }
        }
        
        .nav-tab.active { background-color: white; color: #15803d; border-radius: 8px 8px 0 0; font-weight: bold; border-top: 4px solid #15803d; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="bg-green-800 text-white no-print">
        <div class="container mx-auto px-4 pt-4">
            <div class="flex items-center gap-3 mb-4">
                <i class="fas fa-microscope text-2xl text-lime-400"></i>
                <h1 class="text-xl font-bold uppercase">Science Smart System V9</h1>
            </div>
            <div class="flex gap-2">
                <button onclick="showView('checkin')" id="tab-checkin" class="nav-tab active px-6 py-2 text-sm">เช็คเวลาเรียนประจำวัน</button>
                <button onclick="showView('report')" id="tab-report" class="nav-tab px-6 py-2 text-sm">รายงานรายเดือน</button>
                <button onclick="showView('summary')" id="tab-summary" class="nav-tab px-6 py-2 text-sm">สรุปข้อมูลนักเรียนรายเทอม</button>
            </div>
        </div>
    </header>

    <main id="view-checkin" class="container mx-auto p-4 flex-1 no-print">
        <div class="bg-white rounded-3xl shadow-sm p-6 mb-4 border border-green-100 flex flex-wrap justify-between items-end gap-4">
            <div class="flex flex-wrap gap-4">
                <div class="flex flex-col">
                    <label class="text-xs text-slate-400 font-bold mb-1">ระดับชั้น</label>
                    <select id="gradeSelect" onchange="loadData()" class="bg-green-50 border border-green-200 p-2.5 rounded-xl font-bold text-green-800 outline-none">
                        <option value="P3">ป.3</option><option value="P4">ป.4</option><option value="P5" selected>ป.5</option><option value="P6">ป.6</option>
                    </select>
                </div>
                <div class="flex flex-col">
                    <label class="text-xs text-slate-400 font-bold mb-1">เลือกวันที่</label>
                    <input type="date" id="selectDate" onchange="loadData()" class="bg-green-50 border border-green-200 p-2.5 rounded-xl font-bold text-green-800 outline-none">
                </div>
            </div>
            <div class="flex flex-wrap gap-2">
                <button onclick="setTermDates()" class="bg-blue-600 text-white px-4 py-2 rounded-xl font-bold hover:bg-blue-700 shadow-md">กำหนดวันเปิด-ปิดเทอม</button>
                <button onclick="toggleHoliday()" id="btnHoliday" class="bg-orange-500 text-white px-4 py-2 rounded-xl font-bold hover:bg-orange-600 shadow-md">กำหนดวันหยุด</button>
                <button onclick="toggleAllPresent()" id="btnAll" class="bg-green-600 text-white px-4 py-2 rounded-xl font-bold shadow-md">มาทุกคน</button>
                <button onclick="document.getElementById('modalImport').classList.remove('hidden')" class="bg-amber-500 text-white px-4 py-2 rounded-xl font-bold shadow-md">นำเข้า/ล้างชื่อ</button>
            </div>
        </div>
        <div id="termInfo" class="mb-2 px-6 text-xs text-blue-600 font-bold italic"></div>
        <div id="holidayLabel" class="hidden mb-4 p-4 bg-red-100 text-red-700 rounded-2xl border-l-8 border-red-500 font-bold text-center"></div>
        
        <div class="bg-white rounded-3xl shadow-xl overflow-hidden border border-green-100">
            <table class="w-full text-left">
                <thead class="bg-green-800 text-white text-center">
                    <tr><th class="p-4 w-20">เลขที่</th><th>ชื่อ - นามสกุล</th><th class="w-1/2">สถานะ</th><th>จัดการ</th></tr>
                </thead>
                <tbody id="studentTableBody" class="divide-y divide-slate-100"></tbody>
            </table>
        </div>
    </main>

    <main id="view-report" class="container mx-auto p-4 flex-1 no-print hidden">
        <div class="bg-white rounded-3xl shadow-lg p-6 border border-green-100">
            <h2 class="text-xl font-bold text-green-800 mb-4">รายงานเช็คเวลาเรียนรายเดือน (สำหรับพิมพ์)</h2>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 bg-slate-50 p-6 rounded-2xl mb-6 items-end border border-slate-200">
                <div><label class="text-xs font-bold text-slate-500">เลือกเดือน/ปี</label><input type="month" id="reportMonth" class="w-full border p-2.5 rounded-xl"></div>
                <div><label class="text-xs font-bold text-slate-500">ชั้น</label>
                    <select id="reportGrade" class="w-full border p-2.5 rounded-xl">
                        <option value="P3">ป.3</option><option value="P4">ป.4</option><option value="P5" selected>ป.5</option><option value="P6">ป.6</option>
                    </select>
                </div>
                <button onclick="generateReport()" class="bg-purple-600 text-white p-2.5 rounded-xl font-bold hover:bg-purple-700">สร้างรายงาน</button>
                <button onclick="window.print()" id="btnPrint" class="hidden bg-rose-600 text-white p-2.5 rounded-xl font-bold hover:bg-rose-700">พิมพ์ออกเป็น PDF</button>
            </div>
            <div id="reportPreview" class="overflow-x-auto bg-white p-4 rounded-xl border border-slate-100"></div>
        </div>
    </main>

    <main id="view-summary" class="container mx-auto p-4 flex-1 no-print hidden">
        <div class="bg-white rounded-3xl shadow-xl p-8 border-t-8 border-green-600">
            <h2 class="text-2xl font-bold text-green-800 mb-6">สรุปข้อมูลการมาเรียนรายภาคเรียน</h2>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 bg-green-50 p-6 rounded-2xl mb-8 items-end">
                <div><label class="text-xs font-bold">ปีการศึกษา</label><select id="sumYear" class="w-full border p-2.5 rounded-xl"><option>2569</option><option>2570</option></select></div>
                <div><label class="text-xs font-bold">ภาคเรียน</label><select id="sumTerm" class="w-full border p-2.5 rounded-xl"><option>1</option><option>2</option></select></div>
                <div><label class="text-xs font-bold">ชั้นเรียน</label>
                    <select id="sumGrade" class="w-full border p-2.5 rounded-xl">
                        <option value="P3">ป.3</option><option value="P4">ป.4</option><option value="P5" selected>ป.5</option><option value="P6">ป.6</option>
                    </select>
                </div>
                <button onclick="loadSummary()" class="bg-green-700 text-white p-2.5 rounded-xl font-bold shadow-lg">ดึงข้อมูลสรุป</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full border-collapse border border-slate-200">
                    <thead class="bg-green-800 text-white">
                        <tr><th class="p-3 border">ที่</th><th class="p-3 border text-left">ชื่อ-นามสกุล</th><th class="p-3 border">มา (วัน)</th><th class="p-3 border text-blue-200">ลา</th><th class="p-3 border text-orange-200">สาย</th><th class="p-3 border text-red-200">ขาด</th><th class="p-3 border bg-yellow-400 text-green-900">คิดเป็น % การมาเรียน</th></tr>
                    </thead>
                    <tbody id="summaryTableBody" class="divide-y text-center font-bold"></tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="printArea" class="hidden print-area"></div>

    <div id="modalImport" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50 no-print">
        <div class="bg-white rounded-3xl p-8 w-full max-w-2xl shadow-2xl text-slate-800">
            <h3 class="text-2xl font-bold mb-4">จัดการรายชื่อนักเรียน</h3>
            <textarea id="importArea" rows="10" class="w-full border p-4 rounded-xl font-mono text-sm mb-4" placeholder="เลขที่ ชื่อ-นามสกุล ชื่อเล่น (คั่นด้วยแท็บหรือเว้นวรรค)"></textarea>
            <div class="flex gap-2"><button onclick="processImport()" class="flex-1 bg-green-600 text-white py-3 rounded-xl font-bold">บันทึก</button><button onclick="document.getElementById('modalImport').classList.add('hidden')" class="flex-1 bg-slate-100 py-3 rounded-xl">ปิด</button></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCaAWoyfgWqBx8OiJLKuIOMmy602Y3cb9Q",
            authDomain: "mycheckin-ba316.firebaseapp.com",
            databaseURL: "https://mycheckin-ba316-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "mycheckin-ba316",
            storageBucket: "mycheckin-ba316.firebasestorage.app",
            appId: "1:70860501032:web:6cf057afbdd8330048451d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const dateInput = document.getElementById('selectDate');
        dateInput.valueAsDate = new Date();
        document.getElementById('reportMonth').value = new Date().toISOString().substring(0, 7);

        window.showView = (view) => {
            ['checkin', 'report', 'summary'].forEach(v => {
                document.getElementById('view-'+v).classList.toggle('hidden', v !== view);
                document.getElementById('tab-'+v).classList.toggle('active', v === view);
            });
        };

        // กำหนดวันเปิด-ปิดเทอม
        window.setTermDates = async () => {
            const grade = document.getElementById('gradeSelect').value;
            const start = prompt("วันเปิดเทอม (ปปปป-ดด-วว):", "2026-05-15");
            const end = prompt("วันปิดเทอม (ปปปป-ดด-วว):", "2026-10-10");
            if(start && end) await set(ref(db, `school/${grade}/termDates`), { start, end });
        };

        window.toggleHoliday = async () => {
            const grade = document.getElementById('gradeSelect').value;
            const existing = document.getElementById('holidayLabel').innerText;
            if(!existing) {
                const reason = prompt("วันหยุดเนื่องจาก:");
                if(reason) await set(ref(db, `school/${grade}/holidays/${dateInput.value}`), reason);
            } else {
                if(confirm("ยกเลิกวันหยุด?")) await remove(ref(db, `school/${grade}/holidays/${dateInput.value}`));
            }
        };

        window.updateStatus = async (no, status) => {
            const grade = document.getElementById('gradeSelect').value;
            const currentRef = ref(db, `school/${grade}/attendance/${dateInput.value}/${no}`);
            onValue(currentRef, async (snap) => {
                await set(currentRef, snap.val() === status ? null : status);
            }, { onlyOnce: true });
        };

        window.toggleAllPresent = async () => {
            const grade = document.getElementById('gradeSelect').value;
            onValue(ref(db, `school/${grade}/students`), async (snap) => {
                const students = snap.val() || {};
                const updates = {};
                Object.keys(students).forEach(no => updates[`school/${grade}/attendance/${dateInput.value}/${no}`] = 'มา');
                await update(ref(db), updates);
            }, { onlyOnce: true });
        };

        function loadData() {
            const grade = document.getElementById('gradeSelect').value;
            onValue(ref(db, `school/${grade}`), (snap) => {
                const data = snap.val() || {};
                const students = data.students || {};
                const attendance = (data.attendance && data.attendance[dateInput.value]) || {};
                const holidays = data.holidays || {};
                const termDates = data.termDates || {};

                document.getElementById('termInfo').innerText = termDates.start ? `📍 ช่วงเทอมที่ตั้งไว้: ${termDates.start} ถึง ${termDates.end}` : "⚠️ ยังไม่ได้กำหนดช่วงเปิด-ปิดเทอม";
                
                const hReason = holidays[dateInput.value];
                const labelH = document.getElementById('holidayLabel');
                if(hReason) {
                    labelH.innerText = `[ วันหยุด ] : ${hReason}`; labelH.classList.remove('hidden');
                } else {
                    labelH.classList.add('hidden'); labelH.innerText = '';
                }

                const tbody = document.getElementById('studentTableBody');
                tbody.innerHTML = '';
                Object.keys(students).sort((a,b)=>a-b).forEach(no => {
                    const status = attendance[no] || '';
                    const s = students[no];
                    tbody.innerHTML += `<tr class="hover:bg-green-50 border-b">
                        <td class="p-4 text-center font-bold">${no}</td>
                        <td class="p-4"><b>${s.name}</b> <small class="text-blue-500">(${s.nickname||''})</small></td>
                        <td class="p-4 text-center">
                            <div class="flex justify-center gap-1">
                                <button onclick="updateStatus('${no}', 'มา')" class="px-4 py-1.5 rounded-lg border ${status==='มา'?'bg-green-600 text-white':'text-green-600'}">มา</button>
                                <button onclick="updateStatus('${no}', 'ขาด')" class="px-4 py-1.5 rounded-lg border ${status==='ขาด'?'bg-red-600 text-white':'text-red-600'}">ขาด</button>
                                <button onclick="updateStatus('${no}', 'ลา')" class="px-4 py-1.5 rounded-lg border ${status==='ลา'?'bg-blue-600 text-white':'text-blue-600'}">ลา</button>
                                <button onclick="updateStatus('${no}', 'สาย')" class="px-4 py-1.5 rounded-lg border ${status==='สาย'?'bg-amber-500 text-white':'text-amber-500'}">สาย</button>
                            </div>
                        </td>
                        <td class="p-4 text-center"><button onclick="removeStudent('${no}')" class="text-slate-300 hover:text-red-500"><i class="fas fa-trash"></i></button></td>
                    </tr>`;
                });
            });
        }

        window.loadSummary = () => {
            const grade = document.getElementById('sumGrade').value;
            onValue(ref(db, `school/${grade}`), (snap) => {
                const data = snap.val() || {};
                const students = data.students || {};
                const attendance = data.attendance || {};
                const termDates = data.termDates || {};
                const holidays = data.holidays || {};
                
                if(!termDates.start) return alert("กรุณากำหนดวันเปิด-ปิดเทอมก่อน");

                const start = new Date(termDates.start);
                const end = new Date(termDates.end);
                let totalDays = 0;
                for(let d = new Date(start); d <= end; d.setDate(d.getDate()+1)) {
                    const dateStr = d.toISOString().split('T')[0];
                    if(d.getDay() !== 0 && d.getDay() !== 6 && !holidays[dateStr]) totalDays++;
                }

                const tbody = document.getElementById('summaryTableBody');
                tbody.innerHTML = '';
                Object.keys(students).sort((a,b)=>a-b).forEach(no => {
                    let s = { มา: 0, ลา: 0, ขาด: 0, สาย: 0 };
                    for(let d = new Date(start); d <= end; d.setDate(d.getDate()+1)) {
                        const dateStr = d.toISOString().split('T')[0];
                        const st = (attendance[dateStr] && attendance[dateStr][no]);
                        if(st) s[st]++;
                    }
                    const per = totalDays > 0 ? ((s.มา/totalDays)*100).toFixed(1) : '0';
                    tbody.innerHTML += `<tr><td class="p-2 border">${no}</td><td class="p-2 border text-left">${students[no].name}</td><td class="p-2 border">${s.มา}</td><td class="p-2 border">${s.ลา}</td><td class="p-2 border">${s.สาย}</td><td class="p-2 border">${s.ขาด}</td><td class="p-2 border bg-yellow-50 text-green-800">${per}%</td></tr>`;
                });
            });
        };

        window.generateReport = () => {
            const grade = document.getElementById('reportGrade').value;
            const [year, month] = document.getElementById('reportMonth').value.split('-');
            const monthNames = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
            const daysInMonth = new Date(year, month, 0).getDate();
            
            onValue(ref(db, `school/${grade}`), (snap) => {
                const data = snap.val() || {};
                const students = data.students || {};
                const attendance = data.attendance || {};
                const holidays = data.holidays || {};
                let rows = '';
                Object.keys(students).sort((a,b)=>a-b).forEach((no, idx) => {
                    let cells = ''; let stat = { มา: 0, สาย: 0, ลา: 0, ขาด: 0 };
                    for(let d=1; d<=31; d++) {
                        const dStr = `${year}-${month}-${String(d).padStart(2,'0')}`;
                        const dayOfWeek = new Date(year, month-1, d).getDay();
                        if(d <= daysInMonth) {
                            if(dayOfWeek === 0 || dayOfWeek === 6 || holidays[dStr]) {
                                cells += `<td class="holiday-cell"></td>`;
                            } else {
                                const s = (attendance[dStr] && attendance[dStr][no]) || '';
                                let mark = ''; 
                                if(s==='มา'){ mark='/'; stat.มา++; }
                                else if(s==='ลา'){ mark='ล'; stat.ลา++; }
                                else if(s==='ขาด'){ mark='ข'; stat.ขาด++; }
                                else if(s==='สาย'){ mark='ส'; stat.สาย++; }
                                cells += `<td>${mark}</td>`;
                            }
                        } else { cells += `<td class="holiday-cell"></td>`; }
                    }
                    rows += `<tr><td>${idx+1}</td><td class="name-col font-bold">${students[no].name}</td>${cells}<td>${stat.มา}</td><td>${stat.ลา}</td><td>${stat.ข||0}</td><td>${((stat.มา/daysInMonth)*100).toFixed(0)}</td></tr>`;
                });

                const html = `
                    <div style="text-align:center;">
                        <h2 style="font-size:18px; font-weight:bold; margin-bottom:10px;">แบบบันทึกการมาเรียน เดือน ${monthNames[month-1]} พ.ศ. ${parseInt(year)+543}</h2>
                        <table class="report-table">
                            <thead>
                                <tr><th rowspan="2" class="no-col">ที่</th><th rowspan="2" class="name-col">ชื่อ-สกุล</th><th colspan="31">วันที่</th><th colspan="3">สรุป</th><th rowspan="2">%</th></tr>
                                <tr>${Array.from({length:31}, (_, i) => `<th class="day-col">${i+1}</th>`).join('')}<th>มา</th><th>ลา</th><th>ขาด</th></tr>
                            </thead>
                            <tbody>${rows}</tbody>
                        </table>
                    </div>`;
                document.getElementById('reportPreview').innerHTML = html;
                document.getElementById('printArea').innerHTML = html;
                document.getElementById('btnPrint').classList.remove('hidden');
            });
        };

        window.processImport = async () => {
            const grade = document.getElementById('gradeSelect').value;
            const raw = document.getElementById('importArea').value.trim();
            if(!raw) return;
            const updates = {};
            raw.split('\n').forEach(line => {
                const p = line.split(/\t|\s+/);
                if (p.length >= 2) {
                    const no = p[0].trim();
                    const nickname = p.length > 2 ? p[p.length - 1].trim() : '';
                    const name = p.slice(1, p.length > 2 ? -1 : undefined).join(' ').trim();
                    updates[`school/${grade}/students/${no}`] = { name, nickname };
                }
            });
            await update(ref(db), updates);
            document.getElementById('modalImport').classList.add('hidden');
        };

        window.removeStudent = (no) => { if(confirm('ลบ?')) remove(ref(db, `school/${document.getElementById('gradeSelect').value}/students/${no}`)); };

        loadData();
    </script>
</body>
</html>
