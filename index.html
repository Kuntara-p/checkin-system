<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเช็คชื่อวิชาวิทยาศาสตร์ - Smart Report & Import</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
        :root { --primary-green: #15803d; }
        body { font-family: 'Sarabun', sans-serif; background-color: #f0fdf4; }
        
        /* สไตล์ตารางรายงาน */
        .report-table { border-collapse: collapse; width: 100%; font-size: 10px; }
        .report-table th, .report-table td { border: 1px solid #000; padding: 2px; text-align: center; }
        .text-left-cell { text-align: left !important; padding-left: 5px !important; }
        
        /* เปลี่ยนจากสีเทาเป็นสีเขียวทึบตามสั่ง */
        .weekend-cell { background-color: #166534 !important; color: white; } 

        @media print {
            .no-print { display: none !important; }
            body { background: white; }
            .print-area { display: block !important; width: 297mm; padding: 10mm; }
            @page { size: A4 landscape; margin: 0; }
        }
        .nav-link.active { border-bottom: 3px solid #bef264; color: #bef264; font-weight: bold; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <nav class="bg-green-800 text-white p-4 shadow-lg no-print">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fas fa-microscope text-2xl text-lime-400"></i>
                <h1 class="text-xl font-bold">SCIENCE SMART CHECK-IN</h1>
            </div>
            <div class="flex gap-6">
                <button onclick="showView('checkin')" id="nav-checkin" class="nav-link active py-1">บันทึกเวลาเรียน</button>
                <button onclick="showView('report')" id="nav-report" class="nav-link py-1">ออกรายงานรายเดือน</button>
            </div>
        </div>
    </nav>

    <main id="view-checkin" class="container mx-auto p-6 flex-1 no-print">
        <div class="bg-white rounded-2xl shadow-sm p-6 mb-6 flex flex-wrap justify-between items-center gap-4 border border-green-100">
            <div class="flex items-center gap-4">
                <select id="gradeSelect" onchange="updateGrade()" class="bg-green-50 border border-green-200 p-2 rounded-lg font-bold">
                    <option value="P3">ชั้นประถมศึกษาปีที่ 3</option>
                    <option value="P4">ชั้นประถมศึกษาปีที่ 4</option>
                    <option value="P5" selected>ชั้นประถมศึกษาปีที่ 5</option>
                    <option value="P6">ชั้นประถมศึกษาปีที่ 6</option>
                </select>
                <input type="date" id="selectDate" onchange="loadData()" class="bg-green-50 border border-green-200 p-2 rounded-lg font-bold">
            </div>
            <div class="flex gap-2">
                <button onclick="document.getElementById('modalImport').classList.remove('hidden')" class="bg-amber-500 text-white px-4 py-2 rounded-xl font-bold hover:bg-amber-600">
                    <i class="fas fa-file-import mr-2"></i>นำเข้าจาก Excel
                </button>
                <button onclick="document.getElementById('modalAdd').classList.remove('hidden')" class="bg-indigo-600 text-white px-4 py-2 rounded-xl font-bold hover:bg-indigo-700 shadow-lg">
                    <i class="fas fa-plus mr-2"></i>เพิ่มทีละคน
                </button>
            </div>
        </div>

        <div class="bg-white rounded-3xl shadow-xl overflow-hidden border border-green-100">
            <table class="w-full text-left">
                <thead class="bg-green-800 text-white">
                    <tr>
                        <th class="p-4 text-center w-20">เลขที่</th>
                        <th class="p-4">ชื่อ - นามสกุล</th>
                        <th class="p-4 text-center">สถานะการมาเรียนวันนี้</th>
                        <th class="p-4 text-center w-24">จัดการ</th>
                    </tr>
                </thead>
                <tbody id="studentTableBody" class="divide-y divide-slate-100"></tbody>
            </table>
        </div>
    </main>

    <main id="view-report" class="container mx-auto p-6 flex-1 no-print hidden text-white">
        <div class="bg-blue-800 rounded-3xl p-8 shadow-2xl">
            <div class="flex items-center gap-4 mb-6">
                <div class="bg-yellow-400 p-3 rounded-full text-blue-900"><i class="fas fa-file-invoice fa-2xl"></i></div>
                <div><h2 class="text-3xl font-bold">ออกรายงาน</h2><p class="text-blue-200 text-sm">สร้างรายงานเพื่อสั่งพิมพ์ (A4 แนวนอน)</p></div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 bg-blue-900/50 p-6 rounded-2xl border border-blue-700">
                <div><label class="block text-sm mb-2 opacity-80">ประจำเดือน</label><input type="month" id="reportMonth" class="w-full bg-blue-800 border border-blue-600 p-3 rounded-xl"></div>
                <div class="flex items-end gap-3 md:col-span-2">
                    <button onclick="generateReport()" class="bg-yellow-400 text-blue-900 font-bold px-8 py-3 rounded-xl hover:bg-yellow-300"><i class="fas fa-search mr-2"></i>สร้างรายงาน</button>
                    <button id="btnPrint" onclick="window.print()" class="hidden bg-blue-500 text-white font-bold px-8 py-3 rounded-xl hover:bg-blue-400"><i class="fas fa-print mr-2"></i>พิมพ์ / PDF</button>
                </div>
            </div>
        </div>
        <div id="reportPreview" class="mt-8 bg-white p-10 rounded-2xl shadow-inner border text-slate-800 overflow-x-auto">
            <p class="text-center text-slate-400 italic">เลือกเดือนและกด "สร้างรายงาน" เพื่อดูตัวอย่าง</p>
        </div>
    </main>

    <div id="printArea" class="hidden print-area"></div>

    <div id="modalAdd" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl p-8 w-full max-w-sm shadow-2xl">
            <h3 class="text-2xl font-bold mb-6 text-green-900">เพิ่มนักเรียนใหม่</h3>
            <div class="space-y-4"><input type="number" id="mNo" placeholder="เลขที่" class="w-full border p-3 rounded-xl"><input type="text" id="mName" placeholder="ชื่อ-นามสกุล" class="w-full border p-3 rounded-xl">
                <div class="flex gap-2"><button id="saveBtn" class="flex-1 bg-green-600 text-white py-3 rounded-xl font-bold">บันทึก</button><button onclick="document.getElementById('modalAdd').classList.add('hidden')" class="flex-1 bg-slate-100 py-3 rounded-xl">ยกเลิก</button></div>
            </div>
        </div>
    </div>

    <div id="modalImport" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl p-8 w-full max-w-2xl shadow-2xl">
            <h3 class="text-2xl font-bold mb-2 text-green-900">นำเข้าชื่อจาก Excel / Google Sheet</h3>
            <p class="text-sm text-slate-500 mb-4">ก๊อปปี้คอลัมน์ [เลขที่] และ [ชื่อ-นามสกุล] มาวางด้านล่าง</p>
            <textarea id="importArea" rows="10" class="w-full border p-4 rounded-xl font-mono text-sm mb-4 placeholder:text-slate-300" placeholder="1 นายเรียนดี รักเรียน&#10;2 นายขยัน หมั่นเพียร"></textarea>
            <div class="flex gap-2">
                <button onclick="processImport()" class="flex-1 bg-amber-500 text-white py-3 rounded-xl font-bold hover:bg-amber-600">ประมวลผลและบันทึก</button>
                <button onclick="document.getElementById('modalImport').classList.add('hidden')" class="flex-1 bg-slate-100 py-3 rounded-xl">ยกเลิก</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCaAWoyfgWqBx8OiJLKuIOMmy602Y3cb9Q",
            authDomain: "mycheckin-ba316.firebaseapp.com",
            databaseURL: "https://mycheckin-ba316-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "mycheckin-ba316",
            storageBucket: "mycheckin-ba316.firebasestorage.app",
            appId: "1:70860501032:web:6cf057afbdd8330048451d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentGrade = 'P5';
        const dateInput = document.getElementById('selectDate');
        dateInput.valueAsDate = new Date();
        document.getElementById('reportMonth').value = new Date().toISOString().substring(0, 7);

        window.showView = (view) => {
            document.getElementById('view-checkin').classList.toggle('hidden', view !== 'checkin');
            document.getElementById('view-report').classList.toggle('hidden', view !== 'report');
            document.querySelectorAll('.nav-link').forEach(el => el.classList.remove('active'));
            document.getElementById('nav-' + view).classList.add('active');
        };

        window.updateGrade = () => { currentGrade = document.getElementById('gradeSelect').value; loadData(); };

        window.processImport = async () => {
            const rawData = document.getElementById('importArea').value.trim();
            if (!rawData) return alert("กรุณาวางข้อมูลก่อนครับ");
            const lines = rawData.split('\n');
            const updates = {};
            lines.forEach(line => {
                const parts = line.split(/\t|\s+/);
                if (parts.length >= 2) {
                    const no = parts[0].trim();
                    const name = parts.slice(1).join(' ').trim();
                    if (no && name) updates[`school/${currentGrade}/students/${no}`] = { name };
                }
            });
            try {
                await update(ref(db), updates);
                alert("นำเข้าข้อมูลเรียบร้อยแล้วครับ");
                document.getElementById('modalImport').classList.add('hidden');
                document.getElementById('importArea').value = '';
            } catch (e) { alert("เกิดข้อผิดพลาด: " + e.message); }
        };

        document.getElementById('saveBtn').onclick = async () => {
            const no = document.getElementById('mNo').value;
            const name = document.getElementById('mName').value;
            if(no && name) {
                await set(ref(db, `school/${currentGrade}/students/${no}`), { name });
                document.getElementById('modalAdd').classList.add('hidden');
                alert('บันทึกสำเร็จ');
            }
        };

        window.updateStatus = async (no, status) => {
            await set(ref(db, `school/${currentGrade}/attendance/${dateInput.value}/${no}`), status);
        };

        function loadData() {
            onValue(ref(db, `school/${currentGrade}`), (snap) => {
                const data = snap.val() || {};
                const students = data.students || {};
                const attendance = (data.attendance && data.attendance[dateInput.value]) || {};
                const tbody = document.getElementById('studentTableBody');
                tbody.innerHTML = '';
                Object.keys(students).sort((a,b)=>a-b).forEach(no => {
                    const status = attendance[no] || '';
                    tbody.innerHTML += `
                        <tr class="hover:bg-green-50 border-b border-slate-50">
                            <td class="p-4 text-center font-bold text-slate-700">${no}</td>
                            <td class="p-4 font-bold text-slate-800">${students[no].name}</td>
                            <td class="p-4">
                                <div class="flex justify-center gap-2">
                                    <button onclick="updateStatus('${no}', 'มา')" class="px-3 py-1 rounded-lg border ${status==='มา'?'bg-green-600 text-white border-green-600':'bg-white text-green-600 border-green-600'}">มา</button>
                                    <button onclick="updateStatus('${no}', 'ขาด')" class="px-3 py-1 rounded-lg border ${status==='ขาด'?'bg-red-600 text-white border-red-600':'bg-white text-red-600 border-red-600'}">ขาด</button>
                                    <button onclick="updateStatus('${no}', 'ลา')" class="px-3 py-1 rounded-lg border ${status==='ลา'?'bg-blue-600 text-white border-blue-600':'bg-white text-blue-600 border-blue-600'}">ลา</button>
                                    <button onclick="updateStatus('${no}', 'สาย')" class="px-3 py-1 rounded-lg border ${status==='สาย'?'bg-amber-500 text-white border-amber-500':'bg-white text-amber-500 border-amber-500'}">สาย</button>
                                </div>
                            </td>
                            <td class="p-4 text-center"><button onclick="removeStudent('${no}')" class="text-slate-300 hover:text-red-500"><i class="fas fa-trash-alt"></i></button></td>
                        </tr>`;
                });
            });
        }

        window.removeStudent = (no) => { if(confirm('ลบเลขที่ '+no+'?')) remove(ref(db, `school/${currentGrade}/students/${no}`)); };

        window.generateReport = () => {
            const [year, month] = document.getElementById('reportMonth').value.split('-');
            const monthNames = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
            const daysInMonth = new Date(year, month, 0).getDate();
            const gradeName = document.getElementById('gradeSelect').options[document.getElementById('gradeSelect').selectedIndex].text;
            onValue(ref(db, `school/${currentGrade}`), (snap) => {
                const data = snap.val() || {};
                const students = data.students || {};
                const attendance = data.attendance || {};
                let tableRows = '';
                Object.keys(students).sort((a,b)=>a-b).forEach((no, idx) => {
                    let dayCells = '';
                    let stats = { มา: 0, สาย: 0, ลา: 0, ขาด: 0 };
                    for(let d=1; d<=31; d++) {
                        if(d <= daysInMonth) {
                            const dateStr = `${year}-${month}-${String(d).padStart(2,'0')}`;
                            const status = (attendance[dateStr] && attendance[dateStr][no]) || '';
                            const dayOfWeek = new Date(year, month-1, d).getDay();
                            const isWeekend = dayOfWeek === 0 || dayOfWeek === 6;
                            let mark = '';
                            if(status === 'มา') { mark = '/'; stats.มา++; }
                            else if(status === 'สาย') { mark = 'ส'; stats.สาย++; }
                            else if(status === 'ลา') { mark = 'ล'; stats.ลา++; }
                            else if(status === 'ขาด') { mark = 'ข'; stats.ขาด++; }
                            dayCells += `<td class="${isWeekend?'weekend-cell':''}">${mark}</td>`;
                        } else { 
                            // ช่องวันที่เกินของเดือน (เช่น วันที่ 31 ของเดือนเมษายน) เป็นสีเขียวทึบ
                            dayCells += `<td class="weekend-cell"></td>`; 
                        }
                    }
                    const totalCount = stats.มา + stats.สาย + stats.ลา + stats.ขาด;
                    const percent = totalCount > 0 ? ((stats.มา/daysInMonth)*100).toFixed(1) : '0.0';
                    tableRows += `<tr><td>${idx+1}</td><td class="text-left-cell">${students[no].name}</td>${dayCells}<td>${stats.มา}</td><td>${stats.สาย}</td><td>${stats.ลา}</td><td>${stats.ขาด}</td><td>${percent}%</td></tr>`;
                });
                const htmlContent = `
                    <div style="text-align:center;">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/b/b8/Seal_of_the_Office_of_the_Basic_Education_Commission.png" style="width:50px;margin-bottom:5px;">
                        <h2 style="font-size:16px; font-weight:bold; margin:0;">โรงเรียนบ้านควนเนียง</h2>
                        <p style="font-size:13px; margin:2px;">แบบบันทึกการมาเรียน ประจำเดือน ${monthNames[month-1]} พุทธศักราช ${parseInt(year)+543}</p>
                        <p style="font-size:11px; margin-bottom:10px;">ชั้นเรียน: ${gradeName} | ปีการศึกษา: ${parseInt(year)+543}</p>
                        <table class="report-table">
                            <thead><tr><th rowspan="2">ที่</th><th rowspan="2" style="width:130px;">ชื่อ-สกุล</th><th colspan="31">วันที่</th><th colspan="4">สรุป (วัน)</th><th rowspan="2">%</th></tr>
                            <tr>${Array.from({length:31}, (_, i) => `<th>${i+1}</th>`).join('')}<th>มา</th><th>สาย</th><th>ลา</th><th>ขาด</th></tr></thead>
                            <tbody>${tableRows}</tbody></table></div>`;
                document.getElementById('reportPreview').innerHTML = htmlContent;
                document.getElementById('printArea').innerHTML = htmlContent;
                document.getElementById('btnPrint').classList.remove('hidden');
            });
        };
        loadData();
    </script>
</body>
</html>
