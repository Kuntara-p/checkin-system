<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCIENCE SMART SYSTEM - V27 Final</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Sarabun', sans-serif; background-color: #f0fdf4; }
        .report-table { border-collapse: collapse; width: 100%; table-layout: fixed; font-size: 9px; border: 1px solid black; background: white; }
        .report-table th, .report-table td { border: 1px solid black; padding: 2px 0; text-align: center; height: 18px; color: black; }
        .day-col { width: 20px !important; }
        .no-col { width: 30px !important; }
        .name-col { width: 170px !important; text-align: left !important; padding-left: 5px !important; }
        .stat-col { width: 25px !important; }
        .percent-col { width: 35px !important; }
        .holiday-cell { background-color: #94a3b8 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        @media print {
            .no-print { display: none !important; }
            body { background: white; padding: 0; margin: 0; }
            .print-area { display: block !important; width: 297mm; padding: 10mm; }
            @page { size: A4 landscape; margin: 5mm; }
        }
        .nav-tab.active { background-color: white; color: #15803d; border-radius: 8px 8px 0 0; font-weight: bold; border-top: 4px solid #15803d; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="bg-green-800 text-white no-print">
        <div class="container mx-auto px-4 pt-4">
            <h1 class="text-xl font-bold uppercase tracking-wide">Science Smart System V27</h1>
            <div class="flex gap-2 mt-4 overflow-x-auto">
                <button onclick="showView('checkin')" id="tab-checkin" class="nav-tab active px-6 py-2 text-sm whitespace-nowrap">เช็คเวลาเรียนประจำวัน</button>
                <button onclick="showView('report')" id="tab-report" class="nav-tab px-6 py-2 text-sm whitespace-nowrap">รายงานรายเดือน</button>
                <button onclick="showView('summary')" id="tab-summary" class="nav-tab px-6 py-2 text-sm whitespace-nowrap">สรุปข้อมูลนักเรียนรายเทอม</button>
            </div>
        </div>
    </header>

    <main id="view-checkin" class="container mx-auto p-4 md:p-6 flex-1 no-print">
        <div class="bg-white rounded-3xl shadow-sm p-6 mb-4 border border-green-100 flex flex-wrap justify-between items-end gap-4 shadow-xl">
            <div class="flex flex-wrap items-center gap-4">
                <div class="flex flex-col"><label class="text-xs font-bold mb-1">ปีการศึกษา</label><select id="mainYear" onchange="loadData()" class="border p-2 rounded-xl"><option>2569</option><option>2570</option></select></div>
                <div class="flex flex-col"><label class="text-xs font-bold mb-1">ภาคเรียน</label><select id="mainTerm" onchange="loadData()" class="border p-2 rounded-xl"><option>1</option><option>2</option></select></div>
                <div class="flex flex-col"><label class="text-xs font-bold mb-1">ระดับชั้น</label><select id="gradeSelect" onchange="loadData()" class="border p-2 rounded-xl"><option value="P3">ป.3</option><option value="P4">ป.4</option><option value="P5" selected>ป.5</option><option value="P6">ป.6</option></select></div>
                <div class="flex flex-col"><label class="text-xs font-bold mb-1">เลือกวันที่</label><input type="date" id="selectDate" onchange="loadData()" class="border p-2 rounded-xl"></div>
            </div>
            <div class="flex flex-wrap gap-2">
                <button onclick="setTermDates()" class="bg-blue-600 text-white px-4 py-2 rounded-xl font-bold shadow-md">กำหนดเทอม</button>
                <button onclick="toggleHoliday()" id="btnHoliday" class="bg-orange-500 text-white px-4 py-2 rounded-xl font-bold shadow-md">วันหยุด</button>
                <button onclick="toggleAllPresent()" id="btnAll" class="bg-green-600 text-white px-4 py-2 rounded-xl font-bold shadow-md">มาทุกคน</button>
                <button onclick="resetAttendanceData()" class="bg-red-600 text-white px-4 py-2 rounded-xl font-bold shadow-md"><i class="fas fa-trash-alt mr-1"></i> ล้างการเช็คชื่อ</button>
                <button onclick="document.getElementById('modalImport').classList.remove('hidden')" class="bg-amber-500 text-white px-4 py-2 rounded-xl font-bold shadow-md">นำเข้ารายชื่อ</button>
            </div>
        </div>
        <div id="holidayLabel" class="hidden mb-4 p-4 bg-red-100 text-red-700 rounded-2xl font-bold text-center"></div>
        <div class="bg-white rounded-3xl shadow-xl overflow-hidden border">
            <table class="w-full text-left">
                <thead class="bg-green-800 text-white text-center"><tr><th class="p-4 w-20">ที่</th><th>ชื่อ - นามสกุล</th><th class="w-1/2">สถานะ</th><th class="w-16">ลบ</th></tr></thead>
                <tbody id="studentTableBody" class="divide-y"></tbody>
            </table>
        </div>
    </main>

    <main id="view-report" class="container mx-auto p-4 md:p-6 flex-1 no-print hidden">
        <div class="bg-white rounded-3xl shadow-lg p-8 border">
            <h2 class="text-2xl font-bold text-green-800 mb-6">รายงานรายเดือน</h2>
            <div class="grid grid-cols-1 md:flex gap-4 bg-slate-50 p-6 rounded-2xl border mb-8 items-end">
                <div class="flex-1"><label class="text-xs font-bold block mb-1">เลือกเดือน/ปี</label><input type="month" id="reportMonth" class="w-full border p-3 rounded-xl"></div>
                <button onclick="generateReport()" class="bg-purple-600 text-white p-3 rounded-xl font-bold px-8 shadow-md">ค้นหา</button>
                <button onclick="window.print()" id="btnPrint" class="hidden bg-rose-600 text-white p-3 rounded-xl font-bold px-8 shadow-md">พิมพ์ PDF</button>
            </div>
            <div id="reportPreview" class="overflow-x-auto p-4 bg-white rounded-xl border"></div>
        </div>
    </main>

    <main id="view-summary" class="container mx-auto p-4 md:p-6 flex-1 no-print hidden">
        <div class="bg-white rounded-3xl shadow-xl p-8 border-t-8 border-green-600">
            <h2 class="text-2xl font-bold text-green-800 mb-6 text-center">สรุปสถิติรายภาคเรียน</h2>
            <button onclick="loadSummary()" class="block mx-auto bg-green-700 text-white p-3 rounded-xl font-bold px-12 shadow-md mb-8">ดึงข้อมูลสรุป</button>
            <div class="overflow-x-auto"><table class="w-full border-collapse"><thead class="bg-green-800 text-white"><tr><th class="p-3 border">ที่</th><th class="p-3 border text-left">ชื่อ-นามสกุล</th><th class="p-3 border">มา</th><th class="p-3 border">สาย</th><th class="p-3 border">ลา</th><th class="p-3 border">ขาด</th><th class="p-3 border bg-yellow-400 text-green-900 font-bold">%</th></tr></thead><tbody id="summaryTableBody" class="divide-y font-bold text-center bg-white"></tbody></table></div>
        </div>
    </main>

    <div id="modalImport" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50 no-print">
        <div class="bg-white rounded-3xl p-8 w-full max-w-2xl shadow-2xl"><h3 class="text-xl font-bold mb-4">นำเข้า Excel</h3><textarea id="importArea" rows="10" class="w-full border p-4 rounded-xl font-mono text-sm mb-4" placeholder="เลขที่ ชื่อจริง ชื่อเล่น"></textarea><div class="flex gap-2"><button onclick="processImport()" class="flex-1 bg-amber-500 text-white py-3 rounded-xl font-bold">บันทึก</button><button onclick="document.getElementById('modalImport').classList.add('hidden')" class="flex-1 bg-slate-100 py-3 rounded-xl font-bold">ปิด</button></div></div>
    </div>
    <div id="printArea" class="hidden print-area"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCaAWoyfgWqBx8OiJLKuIOMmy602Y3cb9Q",
            authDomain: "mycheckin-ba316.firebaseapp.com",
            databaseURL: "https://mycheckin-ba316-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "mycheckin-ba316",
            storageBucket: "mycheckin-ba316.firebasestorage.app",
            messagingSenderId: "70860501032",
            appId: "1:70860501032:web:6cf057afbdd8330048451d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const dateInput = document.getElementById('selectDate');
        dateInput.valueAsDate = new Date();
        document.getElementById('reportMonth').value = new Date().toISOString().substring(0, 7);

        window.showView = (v) => { ['checkin','report','summary'].forEach(view => { document.getElementById('view-'+view).classList.toggle('hidden', view!==v); document.getElementById('tab-'+view).classList.toggle('active', view===v); }); };
        const getBaseRef = () => `school/${document.getElementById('gradeSelect').value}/${document.getElementById('mainYear').value}/${document.getElementById('mainTerm').value}`;

        window.loadData = () => {
            onValue(ref(db, getBaseRef()), (snap) => {
                const data = snap.val()||{}, students = data.students||{}, attendance = (data.attendance&&data.attendance[dateInput.value])||{}, holidays = data.holidays||{};
                const labelH = document.getElementById('holidayLabel');
                if(holidays[dateInput.value]) { labelH.innerText = `[ วันหยุด ] : ${holidays[dateInput.value]}`; labelH.classList.remove('hidden'); } else { labelH.classList.add('hidden'); }
                const tbody = document.getElementById('studentTableBody'); tbody.innerHTML = '';
                Object.keys(students).sort((a,b)=>a-b).forEach(no => {
                    const st = attendance[no]||'', s = students[no];
                    tbody.innerHTML += `<tr class="hover:bg-green-50 border-b"><td class="p-4 text-center font-bold text-slate-700">${no}</td><td class="p-4 font-bold">${s.name} <small class="text-blue-500">(${s.nickname||''})</small></td><td class="p-4 text-center"><div class="flex justify-center gap-1"><button onclick="updateStatus('${no}','มา')" class="px-5 py-1.5 rounded-xl border-2 ${st==='มา'?'bg-green-600 text-white border-green-600':'bg-white text-green-600'}">มา</button><button onclick="updateStatus('${no}','ขาด')" class="px-5 py-1.5 rounded-xl border-2 ${st==='ขาด'?'bg-red-600 text-white border-red-600':'bg-white text-red-600'}">ขาด</button><button onclick="updateStatus('${no}','ลา')" class="px-5 py-1.5 rounded-xl border-2 ${st==='ลา'?'bg-blue-600 text-white border-blue-600':'bg-white text-blue-600'}">ลา</button><button onclick="updateStatus('${no}','สาย')" class="px-5 py-1.5 rounded-xl border-2 ${st==='สาย'?'bg-amber-500 text-white border-amber-500':'bg-white text-amber-500'}">สาย</button></div></td><td class="p-4 text-center"><button onclick="removeStudent('${no}')" class="text-slate-300 hover:text-red-500"><i class="fas fa-trash"></i></button></td></tr>`;
                });
            });
        };

        window.updateStatus = async (no, status) => { const path = `${getBaseRef()}/attendance/${dateInput.value}/${no}`; onValue(ref(db, path), async (snap) => { await set(ref(db, path), snap.val()===status?null:status); }, {onlyOnce:true}); };
        window.toggleAllPresent = async () => { const isCancel = document.getElementById('btnAll').innerText.includes("ยกเลิก"); onValue(ref(db, `${getBaseRef()}/students`), async (snap) => { const students = snap.val()||{}, updates = {}; Object.keys(students).forEach(no => updates[`${getBaseRef()}/attendance/${dateInput.value}/${no}`] = isCancel?null:'มา'); await update(ref(db), updates); }, {onlyOnce:true}); };
        window.setTermDates = async () => { const start = prompt("เปิดเทอม (ปปปป-ดด-วว):"), end = prompt("ปิดเทอม (ปปปป-ดด-วว):"); if(start&&end) await set(ref(db, `${getBaseRef()}/termDates`), {start, end}); };
        window.toggleHoliday = async () => { const path = `${getBaseRef()}/holidays/${dateInput.value}`; onValue(ref(db, path), async (snap) => { if(!snap.val()) { const reason = prompt("วันหยุด:"); if(reason) await set(ref(db, path), reason); } else if(confirm("ยกเลิก?")) await remove(ref(db, path)); }, {onlyOnce:true}); };
        window.removeStudent = (no) => { if(confirm('ลบ?')) remove(ref(db, `${getBaseRef()}/students/${no}`)); };
        window.processImport = async () => { const raw = document.getElementById('importArea').value.trim(); if(!raw) return; const updates = {}; const path = getBaseRef(); raw.split('
').forEach(line => { const p = line.trim().split(/\s+/); if (p.length >= 2) updates[`${path}/students/${p[0]}`] = { name: p.slice(1, p.length > 2 ? -1 : undefined).join(' '), nickname: p.length > 2 ? p[p.length-1] : '' }; }); await update(ref(db), updates); document.getElementById('modalImport').classList.add('hidden'); };

        window.resetAttendanceData = async () => {
            if(confirm('คำเตือน: คุณต้องการลบข้อมูลการเช็คชื่อ "ทั้งหมด" ของชั้นเรียนและเทอมนี้ใช่หรือไม่? (ข้อมูลรายชื่อนักเรียนจะไม่หาย)')) {
                const password = prompt("กรุณายืนยันรหัสความปลอดภัย (พิมพ์คำว่า reset):");
                if(password === 'reset') {
                    await remove(ref(db, `${getBaseRef()}/attendance`));
                    alert('ล้างข้อมูลการเช็คชื่อเรียบร้อยแล้ว');
                } else {
                    alert('รหัสไม่ถูกต้อง ยกเลิกการลบ');
                }
            }
        };

        window.generateReport = () => {
            const [year, month] = document.getElementById('reportMonth').value.split('-');
            const daysInMonth = new Date(year, month, 0).getDate();
            const monthNames = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
            onValue(ref(db, getBaseRef()), (snap) => {
                const data = snap.val()||{}, students = data.students||{}, attendance = data.attendance||{}, holidays = data.holidays||{}, termDates = data.termDates||{};
                let rows = ''; let activeDaysTotal = 0;
                for(let d=1; d<=daysInMonth; d++) {
                    const ds = `${year}-${month}-${String(d).padStart(2,'0')}`, dt = new Date(year, month-1, d);
                    const isWeekend = (dt.getDay()===0 || dt.getDay()===6);
                    if(!isWeekend && !holidays[ds] && termDates.start && ds>=termDates.start && ds<=termDates.end) activeDaysTotal++;
                }
                Object.keys(students).sort((a,b)=>a-b).forEach((no, idx) => {
                    let dCells = ''; let s = { มา: 0, สาย: 0, ลา: 0, ขาด: 0 };
                    for(let d=1; d<=31; d++) {
                        const ds = `${year}-${month}-${String(d).padStart(2,'0')}`, dt = new Date(year, month-1, d);
                        if(d>daysInMonth || dt.getDay()===0 || dt.getDay()===6 || holidays[ds]) dCells += `<td class="holiday-cell"></td>`;
                        else {
                            const st = (attendance[ds]&&attendance[ds][no])||'';
                            if(st==='มา'){ dCells += `<td>/</td>`; s.มา++; } else if(st==='ลา'){ dCells += `<td>ล</td>`; s.ลา++; } else if(st==='ขาด'){ dCells += `<td>ข</td>`; s.ขาด++; } else if(st==='สาย'){ dCells += `<td>ส</td>`; s.สาย++; } else dCells += `<td></td>`;
                        }
                    }
                    const per = activeDaysTotal>0 ? ((s.มา/activeDaysTotal)*100).toFixed(0) : '0';
                    rows += `<tr><td>${idx+1}</td><td class="name-col font-bold">${students[no].name}</td>${dCells}<td>${s.มา}</td><td>${s.สาย}</td><td>${s.ลา}</td><td>${s.ขาด}</td><td class="font-bold">${per}%</td></tr>`;
                });
                const html = `<div style="text-align:center;"><img src="https://upload.wikimedia.org/wikipedia/commons/b/b8/Seal_of_the_Office_of_the_Basic_Education_Commission.png" style="width:40px; margin-bottom:5px;"><h2 style="font-size:16px; font-weight:bold; margin:0;">โรงเรียนบ้านควนเนียง</h2><p style="font-size:12px; margin:2px;">แบบบันทึกการมาเรียน เดือน ${monthNames[month-1]} พ.ศ. ${parseInt(year)+543}</p><table class="report-table"><thead><tr><th rowspan="2" class="no-col">ที่</th><th rowspan="2" class="name-col">ชื่อ-สกุล</th><th colspan="31">วันที่</th><th colspan="4" style="width:100px;">สรุป</th><th rowspan="2" class="percent-col">%</th></tr><tr>${Array.from({length:31}, (_, i) => `<th class="day-col">${i+1}</th>`).join('')}<th>มา</th><th>สาย</th><th>ลา</th><th>ขาด</th></tr></thead><tbody>${rows}</tbody></table><div style="text-align:left; font-size:9px; margin-top:10px;">สัญลักษณ์: / = มา, ส = สาย, ล = ลา, ข = ขาด | [สีเทา] = วันหยุด | *วันทำการจริง: ${activeDaysTotal} วัน</div></div>`;
                document.getElementById('reportPreview').innerHTML = html; document.getElementById('printArea').innerHTML = html; document.getElementById('btnPrint').classList.remove('hidden');
            });
        };

        window.loadSummary = () => {
            onValue(ref(db, getBaseRef()), (snap) => {
                const data = snap.val()||{}, termDates = data.termDates||{}, students = data.students||{}, attendance = data.attendance||{}, holidays = data.holidays||{};
                if(!termDates.start) return;
                let schoolDays = 0; const startDate = new Date(termDates.start); const endDate = new Date(termDates.end);
                for(let d=new Date(startDate); d<=endDate; d.setDate(d.getDate()+1)) { const ds = d.toISOString().split('T')[0]; if(d.getDay()!==0 && d.getDay()!==6 && !holidays[ds]) schoolDays++; }
                const tbody = document.getElementById('summaryTableBody'); tbody.innerHTML = '';
                Object.keys(students).sort((a,b)=>a-b).forEach(no => {
                    let s = { มา: 0, ลา: 0, สาย: 0, ขาด: 0 };
                    Object.keys(attendance).forEach(date => { if(date >= termDates.start && date <= termDates.end) { const st = attendance[date][no]; if(st) s[st]++; } });
                    const per = schoolDays>0 ? ((s.มา/schoolDays)*100).toFixed(1) : '0';
                    tbody.innerHTML += `<tr><td class="p-3 border">${no}</td><td class="p-3 border text-left font-bold">${students[no].name}</td><td class="p-3 border">${s.มา}</td><td class="p-3 border text-amber-600">${s.สาย}</td><td class="p-3 border text-blue-600">${s.ลา}</td><td class="p-3 border text-red-600">${s.ขาด}</td><td class="p-3 border bg-yellow-50 text-green-900">${per}%</td></tr>`;
                });
            });
        };

        loadData();
    </script>
</body>
</html>
