<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเช็คชื่อวิชาวิทยาศาสตร์</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500&display=swap');
        body { font-family: 'Kanit', sans-serif; background-color: #f1f5f9; }
        .sidebar { background: #1e1b4b; color: white; }
    </style>
</head>
<body class="flex min-h-screen">

    <div class="w-64 sidebar no-print flex flex-col shadow-xl">
        <div class="p-6 text-2xl font-bold border-b border-indigo-900 flex items-center gap-2 text-cyan-400">
            <i class="fas fa-flask"></i> SCI-CHECK
        </div>
        <nav class="flex-1 mt-6">
            <button onclick="changeGrade('P3', 'ประถมศึกษาปีที่ 3')" id="btn-P3" class="grade-btn w-full text-left px-6 py-4 hover:bg-indigo-800 flex items-center gap-3 transition-all">ป.3</button>
            <button onclick="changeGrade('P4', 'ประถมศึกษาปีที่ 4')" id="btn-P4" class="grade-btn w-full text-left px-6 py-4 hover:bg-indigo-800 flex items-center gap-3 transition-all">ป.4</button>
            <button onclick="changeGrade('P5', 'ประถมศึกษาปีที่ 5')" id="btn-P5" class="grade-btn w-full text-left px-6 py-4 hover:bg-indigo-800 flex items-center gap-3 bg-indigo-700 transition-all">ป.5</button>
            <button onclick="changeGrade('P6', 'ประถมศึกษาปีที่ 6')" id="btn-P6" class="grade-btn w-full text-left px-6 py-4 hover:bg-indigo-800 flex items-center gap-3 transition-all">ป.6</button>
        </nav>
    </div>

    <div class="flex-1 flex flex-col overflow-hidden">
        <header class="bg-white p-4 shadow-md flex justify-between items-center no-print border-b">
            <h2 class="text-xl font-bold text-indigo-900" id="titleGrade">ระดับชั้นประถมศึกษาปีที่ 5</h2>
            <button onclick="document.getElementById('addStudentModal').classList.remove('hidden')" class="bg-indigo-600 text-white px-5 py-2 rounded-lg text-sm shadow hover:bg-indigo-700 transition-all">
                <i class="fas fa-plus"></i> เพิ่มนักเรียน
            </button>
        </header>

        <main class="flex-1 p-6 overflow-auto">
            <div class="bg-white rounded-xl shadow-lg p-6 min-w-[800px]">
                <table class="w-full border-collapse">
                    <thead class="bg-slate-50">
                        <tr>
                            <th class="border border-slate-300 p-2 w-16">เลขที่</th>
                            <th class="border border-slate-300 p-2 text-left">ชื่อ-นามสกุล</th>
                            <th class="border border-slate-300 p-2 w-24 text-center">จัดการ</th>
                        </tr>
                    </thead>
                    <tbody id="studentTableBody">
                        <tr><td colspan="3" class="p-10 text-center text-slate-400 italic">กำลังเชื่อมต่อฐานข้อมูล...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <div id="addStudentModal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl p-8 w-full max-w-sm">
            <h3 class="font-bold text-xl mb-6 text-slate-800">เพิ่มนักเรียนใหม่</h3>
            <input type="number" id="newNo" placeholder="เลขที่" class="w-full border p-2 mb-4 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500">
            <input type="text" id="newName" placeholder="ชื่อ-นามสกุล" class="w-full border p-2 mb-6 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500">
            <div class="flex gap-2">
                <button id="saveBtn" class="flex-1 bg-indigo-600 text-white py-3 rounded-lg font-bold">บันทึกข้อมูล</button>
                <button onclick="document.getElementById('addStudentModal').classList.add('hidden')" class="flex-1 bg-slate-100 py-3 rounded-lg font-bold text-slate-600">ยกเลิก</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCaAWoyfgWqBx8OiJLKuIOMmy602Y3cb9Q",
            authDomain: "mycheckin-ba316.firebaseapp.com",
            databaseURL: "https://mycheckin-ba316-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "mycheckin-ba316",
            storageBucket: "mycheckin-ba316.firebasestorage.app",
            messagingSenderId: "70860501032",
            appId: "1:70860501032:web:6cf057afbdd8330048451d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentGrade = 'P5'; // เปลี่ยนจาก ป.5 เป็น P5 (ไม่มีจุด)

        window.changeGrade = (gradeId, gradeTitle) => {
            currentGrade = gradeId;
            document.querySelectorAll('.grade-btn').forEach(b => b.classList.remove('bg-indigo-700'));
            document.getElementById('btn-'+gradeId).classList.add('bg-indigo-700');
            document.getElementById('titleGrade').innerText = "ระดับ" + gradeTitle;
            loadStudents();
        };

        document.getElementById('saveBtn').addEventListener('click', async () => {
            const no = document.getElementById('newNo').value;
            const name = document.getElementById('newName').value;
            const btn = document.getElementById('saveBtn');

            if(!no || !name) return alert('กรุณากรอกข้อมูลให้ครบ');

            btn.disabled = true;
            btn.innerText = 'กำลังบันทึก...';

            try {
                // บันทึกโดยใช้รหัสชั้นเรียนที่ไม่มีจุด
                await set(ref(db, students/${currentGrade}/${no}), { name: name });
                alert('บันทึกสำเร็จ!');
                document.getElementById('newNo').value = '';
                document.getElementById('newName').value = '';
                document.getElementById('addStudentModal').classList.add('hidden');
            } catch (error) {
                alert('บันทึกไม่สำเร็จ! สาเหตุ: ' + error.message);
            } finally {
                btn.disabled = false;
                btn.innerText = 'บันทึกข้อมูล';
            }
        });

        window.deleteStudent = (no) => {
            if(confirm('ลบรายชื่อนักเรียนเลขที่ ' + no + '?')) {
                remove(ref(db, students/${currentGrade}/${no}));
            }
        };

        function loadStudents() {
            const tbody = document.getElementById('studentTableBody');
            onValue(ref(db, students/${currentGrade}), (snapshot) => {
                const data = snapshot.val();
                tbody.innerHTML = '';
                if(data) {
                    Object.keys(data).sort((a, b) => a - b).forEach(no => {
                        tbody.innerHTML += `
                            <tr class="border-b border-slate-200 hover:bg-indigo-50 transition-all">
                                <td class="p-3 text-center border-r font-bold text-indigo-900">${no}</td>
                                <td class="p-3 text-slate-700 font-medium">${data[no].name}</td>
                                <td class="p-3 text-center">
                                    <button onclick="deleteStudent('${no}')" class="text-red-400 hover:text-red-600 transition-all">
                                        <i class="fas fa-trash-alt"></i>
                                    </button>
                                </td>
                            </tr>`;
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="3" class="p-10 text-center text-slate-400 italic">ยังไม่มีรายชื่อในชั้นนี้</td></tr>';
                }
            });
        }

        loadStudents();
    </script>
</body>
</html>
