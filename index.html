<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเช็คชื่อวิชาวิทยาศาสตร์</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500&display=swap');
        body { font-family: 'Kanit', sans-serif; background-color: #f1f5f9; }
        .sidebar { background: #1e1b4b; color: white; }
        @media print { .no-print { display: none !important; } body { background: white; } }
    </style>
</head>
<body class="flex min-h-screen">

    <div class="w-64 sidebar no-print flex flex-col shadow-xl">
        <div class="p-6 text-2xl font-bold border-b border-indigo-900 flex items-center gap-2">
            <i class="fas fa-flask text-cyan-400"></i> SCI-CHECK
        </div>
        <nav class="flex-1 mt-6">
            <button onclick="changeGrade('ป.3')" id="btn-ป.3" class="grade-btn w-full text-left px-6 py-4 hover:bg-indigo-800 flex items-center gap-3">ป.3</button>
            <button onclick="changeGrade('ป.4')" id="btn-ป.4" class="grade-btn w-full text-left px-6 py-4 hover:bg-indigo-800 flex items-center gap-3">ป.4</button>
            <button onclick="changeGrade('ป.5')" id="btn-ป.5" class="grade-btn w-full text-left px-6 py-4 hover:bg-indigo-800 flex items-center gap-3 bg-indigo-700">ป.5</button>
            <button onclick="changeGrade('ป.6')" id="btn-ป.6" class="grade-btn w-full text-left px-6 py-4 hover:bg-indigo-800 flex items-center gap-3">ป.6</button>
        </nav>
    </div>

    <div class="flex-1 flex flex-col overflow-hidden">
        <header class="bg-white p-4 shadow-md flex justify-between items-center no-print">
            <h2 class="text-xl font-bold text-indigo-900" id="titleGrade">ประถมศึกษาปีที่ 5</h2>
            <div class="flex gap-2">
                <button onclick="toggleModal('addStudentModal')" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm"><i class="fas fa-plus"></i> เพิ่มนักเรียน</button>
                <button onclick="window.print()" class="bg-slate-800 text-white px-4 py-2 rounded-lg text-sm"><i class="fas fa-print"></i> พิมพ์รายงาน</button>
            </div>
        </header>

        <main class="flex-1 p-6 overflow-auto">
            <div class="bg-white rounded-xl shadow-lg p-6 min-w-[1000px]">
                <table class="w-full border-collapse border border-slate-300 text-[12px]">
                    <thead class="bg-slate-50">
                        <tr>
                            <th class="border border-slate-300 p-2 w-12">เลขที่</th>
                            <th class="border border-slate-300 p-2 text-left">ชื่อ-นามสกุล</th>
                            <th class="border border-slate-300 p-2 w-24">สรุป (มา)</th>
                            <th class="border border-slate-300 p-2 w-24">จัดการ</th>
                        </tr>
                    </thead>
                    <tbody id="studentTableBody">
                        </tbody>
                </table>
            </div>
        </main>
    </div>

    <div id="addStudentModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl p-6 w-full max-w-sm shadow-2xl">
            <h3 class="font-bold text-lg mb-4 text-slate-800">เพิ่มรายชื่อนักเรียน</h3>
            <input type="number" id="newNo" placeholder="เลขที่" class="w-full border p-2 mb-3 rounded-lg text-slate-800 focus:ring-2 focus:ring-indigo-500 outline-none">
            <input type="text" id="newName" placeholder="ชื่อ-นามสกุล" class="w-full border p-2 mb-5 rounded-lg text-slate-800 focus:ring-2 focus:ring-indigo-500 outline-none">
            <div class="flex gap-2">
                <button id="saveBtn" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-lg font-bold transition-all">บันทึก</button>
                <button onclick="toggleModal('addStudentModal')" class="flex-1 bg-slate-200 hover:bg-slate-300 py-2 rounded-lg font-bold transition-all">ยกเลิก</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // รหัส Firebase ของคุณครู (ตรวจสอบแล้วว่าถูกต้องตามภาพ image_4)
        const firebaseConfig = {
            apiKey: "AIzaSyCaAWoyfgWqBx8OiJLKuIOMmy602Y3cb9Q",
            authDomain: "mycheckin-ba316.firebaseapp.com",
            databaseURL: "https://mycheckin-ba316-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "mycheckin-ba316",
            storageBucket: "mycheckin-ba316.firebasestorage.app",
            messagingSenderId: "70860501032",
            appId: "1:70860501032:web:6cf057afbdd8330048451d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentGrade = 'ป.5';

        // ฟังก์ชัน เปิด/ปิด Modal
        window.toggleModal = (id) => {
            const el = document.getElementById(id);
            el.classList.toggle('hidden');
        };

        // ฟังก์ชัน เปลี่ยนชั้นเรียน
        window.changeGrade = (grade) => {
            currentGrade = grade;
            document.querySelectorAll('.grade-btn').forEach(b => b.classList.remove('bg-indigo-700'));
            document.getElementById('btn-'+grade).classList.add('bg-indigo-700');
            document.getElementById('titleGrade').innerText = "ประถมศึกษาปีที่ " + grade.replace('ป.', '');
            loadStudents();
        };

        // ฟังก์ชัน บันทึกนักเรียนใหม่ (แก้ไขจุดที่ทำให้กดบันทึกไม่ได้)
        document.getElementById('saveBtn').addEventListener('click', () => {
            const no = document.getElementById('newNo').value;
            const name = document.getElementById('newName').value;
            
            if(no && name) {
                set(ref(db, `students/${currentGrade}/${no}`), {
                    name: name
                }).then(() => {
                    document.getElementById('newNo').value = '';
                    document.getElementById('newName').value = '';
                    toggleModal('addStudentModal');
                    alert('บันทึกสำเร็จ!');
                }).catch((error) => {
                    alert('เกิดข้อผิดพลาด: ' + error.message);
                });
            } else {
                alert('กรุณากรอกข้อมูลให้ครบถ้วน');
            }
        });

        // ฟังก์ชัน ลบนักเรียน
        window.deleteStudent = (no) => {
            if(confirm('ยืนยันการลบนักเรียนเลขที่ ' + no + '?')) {
                remove(ref(db, `students/${currentGrade}/${no}`));
            }
        };

        // ฟังก์ชัน โหลดรายชื่อนักเรียนจาก Firebase
        function loadStudents() {
            const studentRef = ref(db, `students/${currentGrade}`);
            onValue(studentRef, (snapshot) => {
                const data = snapshot.val();
                const tbody = document.getElementById('studentTableBody');
                tbody.innerHTML = '';
                
                if(data) {
                    Object.keys(data).sort((a,b) => a-b).forEach(no => {
                        const row = `
                            <tr class="border-b border-slate-200 hover:bg-slate-50 transition-all">
                                <td class="p-3 text-center border-r border-slate-200 font-bold">${no}</td>
                                <td class="p-3 text-slate-800 font-medium">${data[no].name}</td>
                                <td class="p-3 text-center border-x border-slate-200">-</td>
                                <td class="p-3 text-center">
                                    <button onclick="deleteStudent('${no}')" class="text-red-500 hover:text-red-700 px-2 py-1 rounded">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </td>
                            </tr>
                        `;
                        tbody.innerHTML += row;
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="4" class="p-10 text-center text-slate-400">ยังไม่มีรายชื่อนักเรียนในชั้นนี้</td></tr>';
                }
            });
        }

        // เริ่มต้นโหลดข้อมูล
        loadStudents();
    </script>
</body>
</html>
