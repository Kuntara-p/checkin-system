<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเช็คชื่อวิชาวิทยาศาสตร์ (แบบละเอียด)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500&display=swap');
        body { font-family: 'Kanit', sans-serif; background-color: #f1f5f9; color: #1e293b; }
        .holiday { background-color: #fee2e2 !important; color: #dc2626; font-weight: bold; }
        .weekend { background-color: #f1f5f9; }
        .sidebar { background: #1e1b4b; color: white; transition: all 0.3s; }
        .btn-status { transition: all 0.2s; border: 1px solid transparent; }
        .btn-status:hover { transform: scale(1.05); }
        @media print { 
            .no-print { display: none !important; } 
            .print-only { display: block !important; }
            body { background: white; padding: 0; }
            table { font-size: 10px; border: 1px solid black !important; }
            th, td { border: 1px solid black !important; padding: 2px !important; }
        }
    </style>
</head>
<body class="flex min-h-screen">

    <!-- Sidebar เมนูชั้นเรียน -->
    <div class="w-64 sidebar shadow-2xl no-print flex flex-col">
        <div class="p-6 text-2xl font-bold border-b border-indigo-900 flex items-center gap-2">
            <i class="fas fa-microscope text-cyan-400"></i> SCI-SYSTEM
        </div>
        <nav class="flex-1 mt-6">
            <p class="px-6 text-[10px] text-indigo-300 uppercase font-bold mb-4">ระดับชั้นที่รับผิดชอบ</p>
            <button onclick="changeGrade('ป.3')" id="btn-ป.3" class="grade-btn w-full text-left px-6 py-4 hover:bg-indigo-800 transition-all flex items-center gap-3">
                <i class="fas fa-folder"></i> ป.3
            </button>
            <button onclick="changeGrade('ป.4')" id="btn-ป.4" class="grade-btn w-full text-left px-6 py-4 hover:bg-indigo-800 transition-all flex items-center gap-3">
                <i class="fas fa-folder"></i> ป.4
            </button>
            <button onclick="changeGrade('ป.5')" id="btn-ป.5" class="grade-btn w-full text-left px-6 py-4 hover:bg-indigo-800 transition-all flex items-center gap-3 bg-indigo-700">
                <i class="fas fa-folder-open"></i> ป.5
            </button>
            <button onclick="changeGrade('ป.6')" id="btn-ป.6" class="grade-btn w-full text-left px-6 py-4 hover:bg-indigo-800 transition-all flex items-center gap-3">
                <i class="fas fa-folder"></i> ป.6
            </button>
        </nav>
        <div class="p-4 border-t border-indigo-900 text-[10px] text-indigo-400 text-center">
            ระบบเช็คชื่อ v2.0 © 2026
        </div>
    </div>

    <!-- ส่วนเนื้อหาหลัก -->
    <div class="flex-1 flex flex-col overflow-hidden">
        
        <!-- Top Navigation -->
        <header class="bg-white p-4 shadow-sm flex justify-between items-center no-print">
            <div class="flex items-center gap-4">
                <h2 class="text-xl font-bold" id="titleGrade">ประถมศึกษาปีที่ 5</h2>
                <div class="flex items-center bg-slate-100 rounded-lg px-3 py-1 border">
                    <i class="fas fa-calendar-day text-slate-400 mr-2"></i>
                    <input type="date" id="selectDate" class="bg-transparent border-none text-sm focus:outline-none">
                </div>
            </div>
            <div class="flex gap-2">
                <button onclick="toggleModal('addStudentModal')" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm flex items-center gap-2">
                    <i class="fas fa-user-plus"></i> เพิ่มนักเรียน
                </button>
                <button onclick="window.print()" class="bg-slate-800 hover:bg-slate-900 text-white px-4 py-2 rounded-lg text-sm flex items-center gap-2">
                    <i class="fas fa-print"></i> พิมพ์รายงาน
                </button>
            </div>
        </header>

        <!-- รายงานรูปแบบ Image_14 -->
        <main class="flex-1 p-6 overflow-auto">
            <div class="bg-white rounded-xl shadow-lg p-6 min-w-[1000px]">
                <div class="text-center mb-6">
                    <h3 class="text-xl font-bold">บัญชีลงเวลาเรียนวิชาวิทยาศาสตร์และวิทยาการคำนวณ</h3>
                    <p class="text-sm text-slate-500" id="reportInfo">ชั้นประถมศึกษาปีที่ 5 | ภาคเรียนที่ 1/2569</p>
                </div>

                <table class="w-full border-collapse border border-slate-300 text-[12px]">
                    <thead class="bg-slate-50">
                        <tr>
                            <th rowspan="2" class="border border-slate-300 p-2 w-10">เลขที่</th>
                            <th rowspan="2" class="border border-slate-300 p-2 w-48 text-left">ชื่อ-นามสกุล</th>
                            <th colspan="31" class="border border-slate-300 p-1 text-center" id="monthHeader">พฤษภาคม 2569</th>
                            <th colspan="6" class="border border-slate-300 p-1 text-center bg-indigo-50">สรุป</th>
                        </tr>
                        <tr id="daysRow">
                            <!-- วันที่ 1-31 จะถูกสร้างด้วย JS -->
                        </tr>
                    </thead>
                    <tbody id="attendanceTable">
                        <!-- รายชื่อและสถานะเช็คชื่อ -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Modal เพิ่มนักเรียน -->
    <div id="addStudentModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 no-print">
        <div class="bg-white rounded-xl p-6 w-full max-w-md text-slate-800">
            <h3 class="text-lg font-bold mb-4">เพิ่มรายชื่อนักเรียน</h3>
            <div class="space-y-4">
                <input type="number" id="newStdNo" placeholder="เลขที่" class="w-full border p-2 rounded-lg">
                <input type="text" id="newStdName" placeholder="ชื่อ-นามสกุล" class="w-full border p-2 rounded-lg">
                <div class="flex gap-2">
                    <button onclick="saveNewStudent()" class="flex-1 bg-indigo-600 text-white py-2 rounded-lg">บันทึก</button>
                    <button onclick="toggleModal('addStudentModal')" class="flex-1 bg-slate-200 py-2 rounded-lg">ยกเลิก</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCaAWoyfgWqBx8OiJLKuIOMmy602Y3cb9Q",
            authDomain: "mycheckin-ba316.firebaseapp.com",
            databaseURL: "https://mycheckin-ba316-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "mycheckin-ba316",
            storageBucket: "mycheckin-ba316.firebasestorage.app",
            messagingSenderId: "70860501032",
            appId: "1:70860501032:web:6cf057afbdd8330048451d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentGrade = 'ป.5';
        const dateEl = document.getElementById('selectDate');
        dateEl.valueAsDate = new Date();

        // วันหยุด (ตัวอย่าง)
        const holidays = ["2026-05-01", "2026-05-04", "2026-05-11"];

        window.changeGrade = (grade) => {
            currentGrade = grade;
            document.querySelectorAll('.grade-btn').forEach(b => b.classList.remove('bg-indigo-700'));
            document.getElementById('btn-'+grade).classList.add('bg-indigo-700');
            document.getElementById('titleGrade').innerText = "ประถมศึกษาปีที่ " + grade.replace('ป.', '');
            loadData();
        };

        window.toggleModal = (id) => document.getElementById(id).classList.toggle('hidden');

        window.saveNewStudent = () => {
            const no = document.getElementById('newStdNo').value;
            const name = document.getElementById('newStdName').value;
            if(!no || !name) return alert('กรุณากรอกข้อมูลให้ครบ');
            set(ref(db, `students/${currentGrade}/${no}`), { name }).then(() => {
                toggleModal('addStudentModal');
                loadData();
            });
        };

        window.deleteStudent = (no) => {
            if(confirm('ยืนยันการลบนักเรียนเลขที่ ' + no)) {
                remove(ref(db, `students/${currentGrade}/${no}`)).then(() => loadData());
            }
        };

        function loadData() {
            onValue(ref(db, `students/${currentGrade}`), (snapshot) => {
                const students = snapshot.val() || {};
                onValue(ref(db, `attendance/${currentGrade}`), (attnSnapshot) => {
                    const attendance = attnSnapshot.val() || {};
                    renderTable(students, attendance);
                });
            });
        }

        function renderTable(students, attendance) {
            const daysRow = document.getElementById('daysRow');
            daysRow.innerHTML = '';
            const now = new Date(dateEl.value);
            const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
            
            for(let i=1; i<=31; i++) {
                const isExtra = i > daysInMonth;
                daysRow.innerHTML += `<th class="border border-slate-300 w-6 p-1 ${isExtra ? 'bg-slate-200' : ''}">${i}</th>`;
            }
            // เพิ่มหัวข้อสรุป
            ['ป่วย','ขาด','ลา','สาย','มา','%'].forEach(h => {
                daysRow.innerHTML += `<th class="border border-slate-300 w-8 p-1 bg-indigo-100">${h}</th>`;
            });

            const tbody = document.getElementById('attendanceTable');
            tbody.innerHTML = '';

            Object.keys(students).sort((a,b) => a-b).forEach(no => {
                const std = students[no];
                let rowHtml = `<tr>
                    <td class="border border-slate-300 text-center p-2">${no}</td>
                    <td class="border border-slate-300 p-2 font-medium">
                        <div class="flex justify-between items-center group">
                            ${std.name}
                            <button onclick="deleteStudent('${no}')" class="no-print opacity-0 group-hover:opacity-100 text-red-400 hover:text-red-600">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </td>`;

                let stats = { ป่วย:0, ขาด:0, ลา:0, สาย:0, มา:0 };
                let totalWorkDays = 0;

                for(let d=1; d<=31; d++) {
                    const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                    const status = attendance[dateStr] ? (attendance[dateStr][no] ? attendance[dateStr][no].status : '') : '';
                    
                    const isHoliday = holidays.includes(dateStr);
                    const dayOfWeek = new Date(now.getFullYear(), now.getMonth(), d).getDay();
                    const isWeekend = dayOfWeek === 0 || dayOfWeek === 6;
                    
                    if(!isHoliday && !isWeekend && d <= daysInMonth) totalWorkDays++;
                    if(status) stats[status]++;

                    let cellClass = isHoliday ? 'holiday' : (isWeekend ? 'weekend' : '');
                    let displayStatus = status === 'มา' ? '/' : (status || '');

                    rowHtml += `<td onclick="quickCheck('${no}', ${d})" class="border border-slate-300 text-center cursor-pointer hover:bg-slate-100 ${cellClass}">${displayStatus}</td>`;
                }

                const percent = totalWorkDays > 0 ? Math.round((stats.มา / totalWorkDays) * 100) : 0;
                rowHtml += `
                    <td class="border border-slate-300 text-center font-bold bg-slate-50">${stats.ป่วย}</td>
                    <td class="border border-slate-300 text-center font-bold bg-slate-50">${stats.ขาด}</td>
                    <td class="border border-slate-300 text-center font-bold bg-slate-50">${stats.ลา}</td>
                    <td class="border border-slate-300 text-center font-bold bg-slate-50">${stats.สาย}</td>
                    <td class="border border-slate-300 text-center font-bold bg-slate-50 text-green-600">${stats.มา}</td>
                    <td class="border border-slate-300 text-center font-bold bg-indigo-100">${percent}%</td>
                </tr>`;
                tbody.innerHTML += rowHtml;
            });
        }

        window.quickCheck = (no, day) => {
            const now = new Date(dateEl.value);
            const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
            const status = prompt("กรอกสถานะ: (มา, สาย, ขาด, ป่วย, ลา) หรือเว้นว่างเพื่อลบ", "มา");
            if(status === null) return;
            
            if(status === "") {
                remove(ref(db, `attendance/${currentGrade}/${dateStr}/${no}`));
            } else {
                set(ref(db, `attendance/${currentGrade}/${dateStr}/${no}`), { status });
            }
            loadData();
        };

        dateEl.onchange = loadData;
        loadData();
    </script>
</body>
</html>
