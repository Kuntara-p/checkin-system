<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCIENCE SMART SYSTEM V8 - Term Summary</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Sarabun', sans-serif; background-color: #f0fdf4; }
        .report-table { border-collapse: collapse; width: 100%; table-layout: fixed; font-size: 9px; }
        .report-table th, .report-table td { border: 1px solid #000; padding: 2px 0; text-align: center; height: 18px; }
        .day-col { width: 20px !important; }
        .no-col { width: 30px !important; }
        .name-col { width: 160px !important; text-align: left !important; padding-left: 5px !important; }
        .holiday-cell { background-color: #166534 !important; }
        @media print { .no-print { display: none !important; } body { background: white; } .print-area { display: block !important; width: 297mm; padding: 5mm; } @page { size: A4 landscape; margin: 5mm; } }
        .nav-tab.active { background-color: white; color: #15803d; border-radius: 8px 8px 0 0; font-weight: bold; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="bg-green-800 text-white no-print">
        <div class="container mx-auto px-4 pt-4">
            <div class="flex items-center gap-3 mb-4">
                <i class="fas fa-microscope text-2xl text-lime-400"></i>
                <h1 class="text-xl font-bold uppercase">Science Smart Class</h1>
            </div>
            <div class="flex gap-2">
                <button onclick="showView('checkin')" id="tab-checkin" class="nav-tab active px-4 py-2 text-sm">เช็คเวลาเรียน</button>
                <button onclick="showView('report')" id="tab-report" class="nav-tab px-4 py-2 text-sm">รายงานรายเดือน</button>
                <button onclick="showView('summary')" id="tab-summary" class="nav-tab px-4 py-2 text-sm">สรุปข้อมูลนักเรียน</button>
            </div>
        </div>
    </header>

    <main id="view-checkin" class="container mx-auto p-4 md:p-6 flex-1 no-print">
        <div class="bg-white rounded-3xl shadow-sm p-6 mb-6 border border-green-100">
            <div class="flex flex-wrap justify-between items-end gap-4">
                <div class="flex flex-wrap gap-4">
                    <div class="flex flex-col">
                        <label class="text-xs text-slate-400 font-bold mb-1">ระดับชั้น</label>
                        <select id="gradeSelect" onchange="updateGrade()" class="bg-green-50 border border-green-200 p-2.5 rounded-xl font-bold text-green-800">
                            <option value="P3">ประถมศึกษาปีที่ 3</option><option value="P4">ประถมศึกษาปีที่ 4</option>
                            <option value="P5" selected>ประถมศึกษาปีที่ 5</option><option value="P6">ประถมศึกษาปีที่ 6</option>
                        </select>
                    </div>
                    <div class="flex flex-col">
                        <label class="text-xs text-slate-400 font-bold mb-1">เลือกวันที่</label>
                        <input type="date" id="selectDate" onchange="handleDateChange()" class="bg-green-50 border border-green-200 p-2.5 rounded-xl font-bold text-green-800 outline-none">
                    </div>
                </div>
                <div class="flex flex-wrap gap-2">
                    <button onclick="toggleAllPresent()" id="btnAll" class="bg-green-600 text-white px-4 py-2 rounded-xl font-bold hover:bg-green-700 shadow-md">มาทุกคน</button>
                    <button onclick="setTermDates()" class="bg-blue-600 text-white px-4 py-2 rounded-xl font-bold hover:bg-blue-700 shadow-md">กำหนดวันเปิด-ปิดภาคเรียน</button>
                    <button onclick="toggleHoliday()" id="btnHoliday" class="bg-orange-500 text-white px-4 py-2 rounded-xl font-bold hover:bg-orange-600 shadow-md">กำหนดวันหยุด</button>
                    <button onclick="document.getElementById('modalImport').classList.remove('hidden')" class="bg-amber-500 text-white px-4 py-2 rounded-xl font-bold hover:bg-amber-600 shadow-md">นำเข้า Excel</button>
                </div>
            </div>
            <div id="termInfo" class="mt-4 text-xs font-bold text-blue-600 italic"></div>
        </div>
        <div id="holidayLabel" class="hidden mb-4 p-4 bg-red-100 text-red-700 rounded-2xl border-l-8 border-red-500 font-bold text-center"></div>
        <div class="bg-white rounded-3xl shadow-xl overflow-hidden border border-green-100 min-h-[400px]">
            <table class="w-full text-left">
                <thead class="bg-green-800 text-white">
                    <tr><th class="p-4 text-center w-20">เลขที่</th><th class="p-4">ชื่อ - นามสกุล (ชื่อเล่น)</th><th class="p-4 text-center">สถานะ</th><th class="p-4 text-center w-20">จัดการ</th></tr>
                </thead>
                <tbody id="studentTableBody" class="divide-y divide-slate-100"></tbody>
            </table>
        </div>
    </main>

    <main id="view-report" class="container mx-auto p-6 flex-1 no-print hidden">
        <div class="bg-white rounded-3xl shadow-lg p-8 border border-green-100">
            <h2 class="text-2xl font-bold text-green-800 mb-6">รายงานเช็คเวลาเรียนรายเดือน</h2>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 bg-slate-50 p-6 rounded-2xl mb-8 items-end">
                <div><label class="block text-xs font-bold text-slate-500 mb-2">เดือน</label><input type="month" id="reportMonth" class="w-full border p-3 rounded-xl outline-none"></div>
                <div><button onclick="generateReport()" class="w-full bg-purple-500 text-white p-3 rounded-xl hover:bg-purple-600 shadow-lg font-bold">สร้างรายงาน</button></div>
                <div><button onclick="window.print()" id="btnPrint" class="hidden w-full bg-rose-500 text-white p-3 rounded-xl hover:bg-rose-600 font-bold">พิมพ์ PDF</button></div>
            </div>
            <div id="reportPreview" class="bg-white p-4 border rounded-2xl overflow-x-auto"></div>
        </div>
    </main>

    <main id="view-summary" class="container mx-auto p-6 flex-1 no-print hidden">
        <div class="bg-white rounded-3xl shadow-xl p-8 border border-green-100">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-green-800">สรุปผลการมาเรียน (สถิติรายภาคเรียน)</h2>
                <div class="text-sm font-bold text-slate-500" id="summaryRange"></div>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full border-collapse">
                    <thead class="bg-green-100 text-green-800">
                        <tr>
                            <th class="p-3 border">เลขที่</th><th class="p-3 border text-left">ชื่อ-นามสกุล</th>
                            <th class="p-3 border text-center">มา (ครั้ง)</th><th class="p-3 border text-center text-blue-600">ลา</th>
                            <th class="p-3 border text-center text-orange-600">สาย</th><th class="p-3 border text-center text-red-600">ขาด</th>
                            <th class="p-3 border text-center bg-green-600 text-white">เปอร์เซ็นต์การมาเรียน</th>
                        </tr>
                    </thead>
                    <tbody id="summaryTableBody" class="divide-y"></tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="printArea" class="hidden print-area"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCaAWoyfgWqBx8OiJLKuIOMmy602Y3cb9Q",
            authDomain: "mycheckin-ba316.firebaseapp.com",
            databaseURL: "https://mycheckin-ba316-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "mycheckin-ba316",
            storageBucket: "mycheckin-ba316.firebasestorage.app",
            appId: "1:70860501032:web:6cf057afbdd8330048451d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const dateInput = document.getElementById('selectDate');
        dateInput.valueAsDate = new Date();

        window.showView = (view) => {
            ['checkin', 'report', 'summary'].forEach(v => {
                document.getElementById('view-' + v).classList.toggle('hidden', v !== view);
                document.getElementById('tab-' + v).classList.toggle('active', v === view);
            });
            if(view === 'summary') loadSummary();
        };

        window.updateGrade = () => { loadData(); };
        window.handleDateChange = () => { loadData(); };

        // ฟังก์ชันกำหนดวันเปิด-ปิดเทอม
        window.setTermDates = async () => {
            const start = prompt("ใส่วันเปิดภาคเรียน (เช่น 2026-05-15):");
            const end = prompt("ใส่วันปิดภาคเรียน (เช่น 2026-10-10):");
            if(start && end) {
                await set(ref(db, `school/${document.getElementById('gradeSelect').value}/termDates`), { start, end });
                alert("บันทึกข้อมูลภาคเรียนสำเร็จ");
                loadData();
            }
        };

        window.updateStatus = async (no, status) => {
            const grade = document.getElementById('gradeSelect').value;
            const currentRef = ref(db, `school/${grade}/attendance/${dateInput.value}/${no}`);
            onValue(currentRef, async (snap) => {
                await set(currentRef, snap.val() === status ? null : status);
            }, { onlyOnce: true });
        };

        function loadData() {
            const grade = document.getElementById('gradeSelect').value;
            onValue(ref(db, `school/${grade}`), (snap) => {
                const data = snap.val() || {};
                const students = data.students || {};
                const attendance = (data.attendance && data.attendance[dateInput.value]) || {};
                const holidays = data.holidays || {};
                const termDates = data.termDates || {};

                document.getElementById('termInfo').innerText = termDates.start ? `เปิดเทอม: ${termDates.start} | ปิดเทอม: ${termDates.end}` : "ยังไม่ได้กำหนดวันเปิด-ปิดภาคเรียน";
                
                const hReason = holidays[dateInput.value];
                const btnH = document.getElementById('btnHoliday');
                const labelH = document.getElementById('holidayLabel');
                if(hReason) {
                    btnH.innerText = 'ยกเลิกวันหยุด'; btnH.classList.replace('bg-orange-500', 'bg-red-600');
                    labelH.innerText = `[ วันหยุด ] : ${hReason}`; labelH.classList.remove('hidden');
                } else {
                    btnH.innerText = 'กำหนดวันหยุด'; btnH.classList.replace('bg-red-600', 'bg-orange-500');
                    labelH.classList.add('hidden');
                }

                const tbody = document.getElementById('studentTableBody');
                tbody.innerHTML = '';
                Object.keys(students).sort((a,b)=>a-b).forEach(no => {
                    const status = attendance[no] || '';
                    const s = students[no];
                    tbody.innerHTML += `<tr class="hover:bg-green-50 border-b">
                        <td class="p-4 text-center font-bold">${no}</td>
                        <td class="p-4"><b>${s.name}</b> <small class="text-indigo-500">(${s.nickname || ''})</small></td>
                        <td class="p-4 text-center">
                            <button onclick="updateStatus('${no}', 'มา')" class="px-4 py-1.5 rounded-xl border ${status==='มา'?'bg-green-600 text-white':'text-green-600'}">มา</button>
                            <button onclick="updateStatus('${no}', 'ขาด')" class="px-4 py-1.5 rounded-xl border ${status==='ขาด'?'bg-red-600 text-white':'text-red-600'}">ขาด</button>
                            <button onclick="updateStatus('${no}', 'ลา')" class="px-4 py-1.5 rounded-xl border ${status==='ลา'?'bg-blue-600 text-white':'text-blue-600'}">ลา</button>
                            <button onclick="updateStatus('${no}', 'สาย')" class="px-4 py-1.5 rounded-xl border ${status==='สาย'?'bg-amber-500 text-white':'text-amber-500'}">สาย</button>
                        </td>
                        <td class="p-4 text-center"><button onclick="removeStudent('${no}')" class="text-slate-300 hover:text-red-500"><i class="fas fa-trash-alt"></i></button></td>
                    </tr>`;
                });
            });
        }

        // ฟังก์ชันสรุปข้อมูลเปอร์เซ็นต์
        function loadSummary() {
            const grade = document.getElementById('gradeSelect').value;
            onValue(ref(db, `school/${grade}`), (snap) => {
                const data = snap.val() || {};
                const students = data.students || {};
                const attendance = data.attendance || {};
                const termDates = data.termDates || {};
                const holidays = data.holidays || {};
                
                if(!termDates.start) return alert("กรุณากำหนดวันเปิด-ปิดเทอมก่อนดูสรุป");

                const start = new Date(termDates.start);
                const end = new Date(termDates.end);
                
                // หาจำนวนวันที่มีการเรียนการสอนจริง (ไม่ใช่ ส-อา และไม่ใช่วันหยุดที่ระบุ)
                let schoolDaysCount = 0;
                for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
                    const dateStr = d.toISOString().split('T')[0];
                    const day = d.getDay();
                    if(day !== 0 && day !== 6 && !holidays[dateStr]) schoolDaysCount++;
                }

                const tbody = document.getElementById('summaryTableBody');
                tbody.innerHTML = '';

                Object.keys(students).sort((a,b)=>a-b).forEach(no => {
                    let s = { มา: 0, ลา: 0, สาย: 0, ขาด: 0 };
                    for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
                        const dateStr = d.toISOString().split('T')[0];
                        const status = (attendance[dateStr] && attendance[dateStr][no]);
                        if(status) s[status]++;
                    }
                    const percent = schoolDaysCount > 0 ? ((s.มา / schoolDaysCount) * 100).toFixed(1) : 0;
                    
                    tbody.innerHTML += `<tr>
                        <td class="p-3 text-center border">${no}</td>
                        <td class="p-3 border font-bold">${students[no].name}</td>
                        <td class="p-3 border text-center">${s.มา}</td><td class="p-3 border text-center text-blue-600">${s.ลา}</td>
                        <td class="p-3 border text-center text-orange-600">${s.สาย}</td><td class="p-3 border text-center text-red-600">${s.ขาด}</td>
                        <td class="p-3 border text-center font-bold bg-green-50">${percent}%</td>
                    </tr>`;
                });
            });
        }

        window.processImport = async () => { /* (ฟังก์ชันนำเข้าเดิม) */ };
        window.removeStudent = (no) => { if(confirm('ลบ?')) remove(ref(db, `school/${document.getElementById('gradeSelect').value}/students/${no}`)); };
        
        loadData();
    </script>
</body>
</html>
