<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCIENCE SMART SYSTEM - FULL VERSION</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Sarabun', sans-serif; background-color: #f0fdf4; }
        
        /* สไตล์ตารางรายงานตามภาพ 100% */
        .report-table { border-collapse: collapse; width: 100%; table-layout: fixed; font-size: 9px; }
        .report-table th, .report-table td { border: 1px solid #000; padding: 2px 0; text-align: center; height: 18px; }
        .day-col { width: 20px !important; }
        .no-col { width: 30px !important; }
        .name-col { width: 160px !important; text-align: left !important; padding-left: 5px !important; }
        .stat-col { width: 25px !important; }
        .percent-col { width: 35px !important; }

        .holiday-cell { background-color: #166534 !important; }
        .weekend-cell { background-color: #f3f4f6; }

        @media print {
            .no-print { display: none !important; }
            body { background: white; }
            .print-area { display: block !important; width: 297mm; padding: 5mm; }
            @page { size: A4 landscape; margin: 5mm; }
        }
        .nav-tab.active { background-color: white; color: #15803d; border-radius: 8px 8px 0 0; font-weight: bold; }
        .loading-overlay { position: relative; }
        .loading-overlay::after { content: "กำลังประมวลผล..."; position: absolute; inset: 0; background: rgba(255,255,255,0.7); display: flex; align-items: center; justify-content: center; z-index: 10; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="bg-green-800 text-white no-print">
        <div class="container mx-auto px-4 pt-4">
            <div class="flex items-center gap-3 mb-4">
                <i class="fas fa-flask text-2xl text-lime-400"></i>
                <h1 class="text-xl font-bold uppercase tracking-tight">Science Smart System</h1>
            </div>
            <div class="flex gap-2">
                <button onclick="showView('checkin')" id="tab-checkin" class="nav-tab active px-6 py-2 text-sm transition-all">เช็คเวลาเรียนประจำชั้น</button>
                <button onclick="showView('report')" id="tab-report" class="nav-tab px-6 py-2 text-sm transition-all">รายงานรายเดือน</button>
                <button onclick="showView('summary')" id="tab-summary" class="nav-tab px-6 py-2 text-sm transition-all text-yellow-300"><i class="fas fa-chart-pie mr-1"></i>สรุปข้อมูลนักเรียน</button>
            </div>
        </div>
    </header>

    <main id="view-checkin" class="container mx-auto p-4 md:p-6 flex-1 no-print">
        <div class="bg-white rounded-3xl shadow-sm p-6 mb-6 border border-green-100 flex flex-wrap justify-between items-end gap-4">
            <div class="flex flex-wrap items-center gap-4">
                <div class="flex flex-col">
                    <label class="text-xs text-slate-400 font-bold mb-1">ระดับชั้น</label>
                    <select id="gradeSelect" onchange="updateGrade()" class="bg-green-50 border border-green-200 p-2.5 rounded-xl font-bold text-green-800 outline-none">
                        <option value="P3">ประถมศึกษาปีที่ 3</option>
                        <option value="P4">ประถมศึกษาปีที่ 4</option>
                        <option value="P5" selected>ประถมศึกษาปีที่ 5</option>
                        <option value="P6">ประถมศึกษาปีที่ 6</option>
                    </select>
                </div>
                <div class="flex flex-col">
                    <label class="text-xs text-slate-400 font-bold mb-1">เลือกวันที่</label>
                    <input type="date" id="selectDate" onchange="handleDateChange()" class="bg-green-50 border border-green-200 p-2.5 rounded-xl font-bold text-green-800 outline-none">
                </div>
            </div>
            
            <div class="flex flex-wrap gap-2">
                <button onclick="toggleAllPresent()" id="btnAll" class="bg-green-600 text-white px-5 py-2.5 rounded-xl font-bold hover:bg-green-700 shadow-md transition-all">มาทุกคน</button>
                <button onclick="setTermDates()" class="bg-blue-600 text-white px-5 py-2.5 rounded-xl font-bold hover:bg-blue-700 shadow-md">กำหนดวันเปิด-ปิดเทอม</button>
                <button onclick="toggleHoliday()" id="btnHoliday" class="bg-orange-500 text-white px-5 py-2.5 rounded-xl font-bold hover:bg-orange-600 shadow-md transition-all">กำหนดวันหยุด</button>
                <button onclick="document.getElementById('modalImport').classList.remove('hidden')" class="bg-amber-500 text-white px-5 py-2.5 rounded-xl font-bold hover:bg-amber-600 shadow-md">นำเข้า Excel</button>
            </div>
        </div>
        <div id="holidayLabel" class="hidden mb-4 p-4 bg-red-100 text-red-700 rounded-2xl border-l-8 border-red-500 font-bold text-center"></div>
        <div id="tableWrapper" class="bg-white rounded-3xl shadow-xl overflow-hidden border border-green-100 min-h-[400px]">
            <table class="w-full text-left">
                <thead class="bg-green-800 text-white">
                    <tr><th class="p-4 text-center w-20">เลขที่</th><th class="p-4">ชื่อ - นามสกุล (ชื่อเล่น)</th><th class="p-4 text-center">สถานะการมาเรียนวันนี้</th><th class="p-4 text-center w-20">จัดการ</th></tr>
                </thead>
                <tbody id="studentTableBody" class="divide-y divide-slate-100"></tbody>
            </table>
        </div>
    </main>

    <main id="view-report" class="container mx-auto p-4 md:p-6 flex-1 no-print hidden">
        <div class="bg-white rounded-3xl shadow-lg p-8 border border-green-100">
            <h2 class="text-2xl font-bold text-green-800 mb-6 flex items-center gap-2">
                <i class="fas fa-file-signature text-yellow-500"></i> รายงานเช็คเวลาเรียนประจำชั้นรายเดือน
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-5 gap-4 bg-slate-50 p-6 rounded-2xl border border-slate-200 mb-8 items-end">
                <div><label class="block text-xs font-bold text-slate-500 mb-2">ปีการศึกษา</label><select class="w-full border p-3 rounded-xl bg-white"><option>2569</option><option>2570</option></select></div>
                <div><label class="block text-xs font-bold text-slate-500 mb-2">ภาคเรียน</label><select class="w-full border p-3 rounded-xl bg-white"><option>1</option><option>2</option></select></div>
                <div><label class="block text-xs font-bold text-slate-500 mb-2">เดือน</label><input type="month" id="reportMonth" class="w-full border p-3 rounded-xl bg-white"></div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-2">ระดับชั้น</label>
                    <select id="reportGrade" class="w-full border p-3 rounded-xl bg-white">
                        <option value="P3">ป.3</option><option value="P4">ป.4</option><option value="P5" selected>ป.5</option><option value="P6">ป.6</option>
                    </select>
                </div>
                <div class="flex gap-2">
                    <button onclick="generateReport()" class="flex-1 bg-purple-500 text-white p-3 rounded-xl hover:bg-purple-600 shadow-lg"><i class="fas fa-search"></i></button>
                    <button onclick="window.print()" id="btnPrint" class="hidden flex-1 bg-rose-500 text-white p-3 rounded-xl font-bold">พิมพ์ PDF</button>
                </div>
            </div>
            <div id="reportPreview" class="bg-white p-6 border rounded-2xl overflow-x-auto min-h-[400px]"></div>
        </div>
    </main>

    <main id="view-summary" class="container mx-auto p-6 flex-1 no-print hidden">
        <div class="bg-white rounded-3xl shadow-xl p-8 border-t-8 border-green-600">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-green-800">สรุปผลการมาเรียนรายภาคเรียน</h2>
                <div id="termDateRange" class="text-sm font-bold text-indigo-600 bg-indigo-50 px-4 py-2 rounded-lg"></div>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full border-collapse">
                    <thead class="bg-green-800 text-white">
                        <tr>
                            <th class="p-3 border border-green-700">เลขที่</th>
                            <th class="p-3 border border-green-700 text-left">ชื่อ-นามสกุล</th>
                            <th class="p-3 border border-green-700">มา (วัน)</th>
                            <th class="p-3 border border-green-700">สาย</th>
                            <th class="p-3 border border-green-700">ลา</th>
                            <th class="p-3 border border-green-700">ขาด</th>
                            <th class="p-3 border border-green-700 bg-yellow-400 text-green-900 font-black">เปอร์เซ็นต์ (%)</th>
                        </tr>
                    </thead>
                    <tbody id="summaryTableBody" class="divide-y bg-white"></tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="printArea" class="hidden print-area"></div>

    <div id="modalImport" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl p-8 w-full max-w-2xl shadow-2xl text-slate-800">
            <h3 class="text-2xl font-bold mb-4 text-green-900 border-b pb-2">จัดการรายชื่อ</h3>
            <textarea id="importArea" rows="10" class="w-full border p-4 rounded-xl font-mono text-sm mb-4 outline-none focus:ring-2 focus:ring-green-500" placeholder="1 ด.ช.วิทย์ เก่งมาก น้อง&#10;2 ด.ญ.วิทยาศาสตร์ ใจดี แอนนี่"></textarea>
            <div class="flex gap-2"><button onclick="processImport()" class="flex-1 bg-green-600 text-white py-3 rounded-xl font-bold">บันทึกข้อมูล</button><button onclick="document.getElementById('modalImport').classList.add('hidden')" class="flex-1 bg-slate-100 py-3 rounded-xl">ปิด</button></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCaAWoyfgWqBx8OiJLKuIOMmy602Y3cb9Q",
            authDomain: "mycheckin-ba316.firebaseapp.com",
            databaseURL: "https://mycheckin-ba316-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "mycheckin-ba316",
            storageBucket: "mycheckin-ba316.firebasestorage.app",
            appId: "1:70860501032:web:6cf057afbdd8330048451d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const dateInput = document.getElementById('selectDate');
        dateInput.valueAsDate = new Date();
        document.getElementById('reportMonth').value = new Date().toISOString().substring(0, 7);

        window.showView = (view) => {
            ['checkin', 'report', 'summary'].forEach(v => {
                document.getElementById('view-'+v).classList.toggle('hidden', v !== view);
                document.getElementById('tab-'+v).classList.toggle('active', v === view);
            });
            if(view === 'summary') loadSummary();
        };

        window.updateGrade = () => { loadData(); };
        window.handleDateChange = () => { document.getElementById('studentTableBody').innerHTML = ''; loadData(); };

        // กำหนดวันเปิด-ปิดเทอม
        window.setTermDates = async () => {
            const grade = document.getElementById('gradeSelect').value;
            const start = prompt("ใส่วันเปิดเทอม (เช่น 2026-05-15):");
            const end = prompt("ใส่วันปิดเทอม (เช่น 2026-10-10):");
            if(start && end) {
                await set(ref(db, `school/${grade}/termDates`), { start, end });
                alert("บันทึกช่วงเวลาภาคเรียนสำเร็จ!");
                loadData();
            }
        };

        window.toggleHoliday = async () => {
            const grade = document.getElementById('gradeSelect').value;
            const btn = document.getElementById('btnHoliday');
            if(!btn.classList.contains('bg-red-600')) {
                const reason = prompt("หยุดเนื่องในโอกาส:");
                if(reason) await set(ref(db, `school/${grade}/holidays/${dateInput.value}`), reason);
            } else {
                if(confirm("ยกเลิกวันหยุด?")) await remove(ref(db, `school/${grade}/holidays/${dateInput.value}`));
            }
        };

        window.toggleAllPresent = async () => {
            const grade = document.getElementById('gradeSelect').value;
            const btn = document.getElementById('btnAll');
            const isCancel = btn.innerText.includes("ยกเลิก");
            onValue(ref(db, `school/${grade}/students`), async (snap) => {
                const students = snap.val() || {};
                const updates = {};
                Object.keys(students).forEach(no => updates[`school/${grade}/attendance/${dateInput.value}/${no}`] = isCancel ? null : 'มา');
                await update(ref(db), updates);
            }, { onlyOnce: true });
        };

        window.updateStatus = async (no, status) => {
            const grade = document.getElementById('gradeSelect').value;
            const currentRef = ref(db, `school/${grade}/attendance/${dateInput.value}/${no}`);
            onValue(currentRef, async (snap) => {
                await set(currentRef, snap.val() === status ? null : status);
            }, { onlyOnce: true });
        };

        function loadData() {
            const grade = document.getElementById('gradeSelect').value;
            onValue(ref(db, `school/${grade}`), (snap) => {
                const data = snap.val() || {};
                const students = data.students || {};
                const attendance = (data.attendance && data.attendance[dateInput.value]) || {};
                const holidays = data.holidays || {};
                
                const hReason = holidays[dateInput.value];
                const btnH = document.getElementById('btnHoliday');
                const labelH = document.getElementById('holidayLabel');
                if(hReason) {
                    btnH.innerText = 'ยกเลิกวันหยุด'; btnH.classList.replace('bg-orange-500', 'bg-red-600');
                    labelH.innerText = `[ วันหยุดวันนี้ ] : ${hReason}`; labelH.classList.remove('hidden');
                } else {
                    btnH.innerText = 'กำหนดวันหยุด'; btnH.classList.replace('bg-red-600', 'bg-orange-500');
                    labelH.classList.add('hidden');
                }

                const btnA = document.getElementById('btnAll');
                const presentCount = Object.values(attendance).filter(v => v === 'มา').length;
                if(presentCount > 0 && presentCount === Object.keys(students).length) {
                    btnA.innerHTML = 'ยกเลิกทุกคน'; btnA.classList.replace('bg-green-600', 'bg-slate-500');
                } else {
                    btnA.innerHTML = 'มาทุกคน'; btnA.classList.replace('bg-slate-500', 'bg-green-600');
                }

                const tbody = document.getElementById('studentTableBody');
                tbody.innerHTML = '';
                Object.keys(students).sort((a,b)=>a-b).forEach(no => {
                    const status = attendance[no] || '';
                    const s = students[no];
                    tbody.innerHTML += `
                        <tr class="hover:bg-green-50 border-b border-slate-100">
                            <td class="p-4 text-center font-bold text-slate-700">${no}</td>
                            <td class="p-4"><div class="font-bold text-slate-800 text-sm">${s.name}</div><div class="text-[11px] text-indigo-500">${s.nickname ? '('+s.nickname+')' : ''}</div></td>
                            <td class="p-4"><div class="flex justify-center gap-1">
                                <button onclick="updateStatus('${no}', 'มา')" class="px-5 py-1.5 rounded-xl border-2 ${status==='มา'?'bg-green-600 text-white border-green-600':'bg-white text-green-600 border-green-100'}">มา</button>
                                <button onclick="updateStatus('${no}', 'ขาด')" class="px-5 py-1.5 rounded-xl border-2 ${status==='ขาด'?'bg-red-600 text-white border-red-600':'bg-white text-red-600 border-red-100'}">ขาด</button>
                                <button onclick="updateStatus('${no}', 'ลา')" class="px-5 py-1.5 rounded-xl border-2 ${status==='ลา'?'bg-blue-600 text-white border-blue-600':'bg-white text-blue-600 border-blue-100'}">ลา</button>
                                <button onclick="updateStatus('${no}', 'สาย')" class="px-5 py-1.5 rounded-xl border-2 ${status==='สาย'?'bg-amber-500 text-white border-amber-500':'bg-white text-amber-500 border-amber-100'}">สาย</button>
                            </div></td>
                            <td class="p-4 text-center"><button onclick="removeStudent('${no}')" class="text-slate-300 hover:text-red-500"><i class="fas fa-trash-alt"></i></button></td>
                        </tr>`;
                });
            });
        }

        function loadSummary() {
            const grade = document.getElementById('gradeSelect').value;
            onValue(ref(db, `school/${grade}`), (snap) => {
                const data = snap.val() || {};
                const students = data.students || {};
                const attendance = data.attendance || {};
                const termDates = data.termDates || {};
                const holidays = data.holidays || {};
                
                if(!termDates.start) {
                    document.getElementById('summaryTableBody').innerHTML = '<tr><td colspan="7" class="p-20 text-center text-red-500 font-bold">กรุณากำหนดวันเปิด-ปิดเทอมในหน้าเช็คชื่อก่อนครับ</td></tr>';
                    return;
                }

                document.getElementById('termDateRange').innerText = `ช่วงภาคเรียน: ${termDates.start} ถึง ${termDates.end}`;
                
                const start = new Date(termDates.start);
                const end = new Date(termDates.end);
                let totalSchoolDays = 0;
                for(let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
                    const dateStr = d.toISOString().split('T')[0];
                    if(d.getDay() !== 0 && d.getDay() !== 6 && !holidays[dateStr]) totalSchoolDays++;
                }

                const tbody = document.getElementById('summaryTableBody');
                tbody.innerHTML = '';
                Object.keys(students).sort((a,b)=>a-b).forEach(no => {
                    let stat = { มา: 0, สาย: 0, ลา: 0, ขาด: 0 };
                    for(let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
                        const dateStr = d.toISOString().split('T')[0];
                        const s = (attendance[dateStr] && attendance[dateStr][no]);
                        if(s) stat[s]++;
                    }
                    const per = totalSchoolDays > 0 ? ((stat.มา/totalSchoolDays)*100).toFixed(1) : '0.0';
                    tbody.innerHTML += `<tr><td class="p-3 text-center border">${no}</td><td class="p-3 border font-bold">${students[no].name}</td><td class="p-3 border text-center">${stat.มา}</td><td class="p-3 border text-center text-amber-600">${stat.สาย}</td><td class="p-3 border text-center text-blue-600">${stat.ลา}</td><td class="p-3 border text-center text-red-600">${stat.ขาด}</td><td class="p-3 border text-center bg-yellow-100 font-black text-green-800">${per}%</td></tr>`;
                });
            });
        }

        window.removeStudent = (no) => {
            const grade = document.getElementById('gradeSelect').value;
            if(confirm('ลบรายชื่อนักเรียนเลขที่ ' + no + '?')) remove(ref(db, `school/${grade}/students/${no}`));
        };

        window.processImport = async () => {
            const grade = document.getElementById('gradeSelect').value;
            const raw = document.getElementById('importArea').value.trim();
            if(!raw) return;
            const updates = {};
            raw.split('\n').forEach(line => {
                const p = line.split(/\t|\s+/);
                if (p.length >= 2) {
                    const no = p[0].trim();
                    const nickname = p.length > 2 ? p[p.length - 1].trim() : '';
                    const name = p.slice(1, p.length > 2 ? -1 : undefined).join(' ').trim();
                    updates[`school/${grade}/students/${no}`] = { name, nickname };
                }
            });
            await update(ref(db), updates);
            document.getElementById('modalImport').classList.add('hidden');
        };

        window.generateReport = () => {
            const grade = document.getElementById('reportGrade').value;
            const [year, month] = document.getElementById('reportMonth').value.split('-');
            const monthNames = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
            const daysInMonth = new Date(year, month, 0).getDate();
            const gradeName = document.getElementById('reportGrade').options[document.getElementById('reportGrade').selectedIndex].text;
            
            onValue(ref(db, `school/${grade}`), (snap) => {
                const data = snap.val() || {};
                const students = data.students || {};
                const attendance = data.attendance || {};
                const holidays = data.holidays || {};
                let tableRows = ''; let hNotes = [];
                Object.keys(students).sort((a,b)=>a-b).forEach((no, idx) => {
                    let dCells = ''; let s = { มา: 0, สาย: 0, ลา: 0, ขาด: 0 };
                    for(let d=1; d<=31; d++) {
                        const dateStr = `${year}-${month}-${String(d).padStart(2,'0')}`;
                        const hReason = holidays[dateStr];
                        const dayOfWeek = new Date(year, month-1, d).getDay();
                        const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);
                        if(d <= daysInMonth) {
                            if(hReason || isWeekend) {
                                dCells += `<td class="holiday-cell"></td>`;
                                if(hReason && idx === 0) hNotes.push(`วันที่ ${d} ${monthNames[month-1]} หยุดเนื่องจาก${hReason}`);
                            } else {
                                const st = (attendance[dateStr] && attendance[dateStr][no]) || '';
                                let m = ''; if(st==='มา'){m='/'; s.มา++;} else if(st==='สาย'){m='ส'; s.สาย++;} else if(st==='ลา'){m='ล'; s.ลา++;} else if(st==='ขาด'){m='ข'; s.ขาด++;}
                                dCells += `<td>${m}</td>`;
                            }
                        } else { dCells += `<td class="holiday-cell"></td>`; }
                    }
                    const per = s.มา > 0 ? ((s.มา/daysInMonth)*100).toFixed(1) : '0.0';
                    tableRows += `<tr><td>${idx+1}</td><td class="name-col font-bold">${students[no].name} ${students[no].nickname ? '('+students[no].nickname+')' : ''}</td>${dCells}<td class="stat-col">${s.มา}</td><td class="stat-col">${s.สาย}</td><td class="stat-col">${s.ลา}</td><td class="stat-col">${s.ขาด}</td><td class="percent-col font-bold">${per}%</td></tr>`;
                });

                const html = `
                    <div style="text-align:center;">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/b/b8/Seal_of_the_Office_of_the_Basic_Education_Commission.png" style="width:40px; margin-bottom:5px;">
                        <h2 style="font-size:16px; font-weight:bold; margin:0;">โรงเรียนบ้านควนเนียง</h2>
                        <p style="font-size:12px; margin:2px;">แบบบันทึกการมาเรียน ประจำเดือน ${monthNames[month-1]} พุทธศักราช ${parseInt(year)+543}</p>
                        <p style="font-size:10px; margin-bottom:5px; color:#666;">ชั้นเรียน: ${gradeName} | กลุ่มสาระวิทยาศาสตร์</p>
                        <table class="report-table">
                            <thead><tr><th rowspan="2" class="no-col">ที่</th><th rowspan="2" class="name-col">ชื่อ-สกุล</th><th colspan="31">วันที่</th><th colspan="4" style="width:100px;">สรุป (วัน)</th><th rowspan="2" class="percent-col">%</th></tr>
                            <tr>${Array.from({length:31}, (_, i) => `<th class="day-col">${i+1}</th>`).join('')}<th class="stat-col">มา</th><th class="stat-col">สาย</th><th class="stat-col">ลา</th><th class="stat-col">ขาด</th></tr></thead>
                            <tbody>${tableRows}</tbody></table>
                        <div style="text-align:left; font-size:10px; margin-top:10px;">
                            <p><b>หมายเหตุวันหยุดพิเศษ:</b></p>
                            ${hNotes.length > 0 ? hNotes.map(n => `<p>• ${n}</p>`).join('') : '<p>• (ไม่มีวันหยุดพิเศษ)</p>'}
                        </div>
                    </div>`;
                document.getElementById('reportPreview').innerHTML = html;
                document.getElementById('printArea').innerHTML = html;
                document.getElementById('btnPrint').classList.remove('hidden');
            });
        };

        loadData();
    </script>
</body>
</html>
