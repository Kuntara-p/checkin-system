<script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, set, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCAaWoYfgWqBx8O1JlKuiOMmy6O2Y3cb9Q",
            authDomain: "mycheckin-ba316.firebaseapp.com",
            databaseURL: "https://mycheckin-ba316-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "mycheckin-ba316",
            storageBucket: "mycheckin-ba316.firebasestorage.app",
            messagingSenderId: "70860501032",
            appId: "1:70860501032:web:6cf057afbdd8330848451d",
            measurementId: "G-34YNM7B1N0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // 1. ตรวจสอบสถานะการล็อกอิน
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('loginPage').classList.add('hidden');
                document.getElementById('mainPage').classList.remove('hidden');
                loadStudents(); // โหลดรายชื่อเมื่อล็อกอินแล้ว
            } else {
                document.getElementById('loginPage').classList.remove('hidden');
                document.getElementById('mainPage').classList.add('hidden');
            }
        });

        // 2. ฟังก์ชันล็อกอิน
        window.handleLogin = async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('loginError');

            try {
                await signInWithEmailAndPassword(auth, email, password);
                errorMsg.classList.add('hidden');
            } catch (error) {
                errorMsg.innerText = "อีเมลหรือรหัสผ่านไม่ถูกต้อง";
                errorMsg.classList.remove('hidden');
            }
        };

        // 3. ฟังก์ชันออกจากระบบ
        window.handleLogout = () => signOut(auth);

        // 4. ฟังก์ชันเพิ่มนักเรียน
        window.addStudent = () => {
            const id = document.getElementById('stdId').value;
            const name = document.getElementById('stdName').value;

            if (id && name) {
                set(ref(db, 'students/' + id), { name: name })
                .then(() => {
                    document.getElementById('stdId').value = '';
                    document.getElementById('stdName').value = '';
                });
            } else {
                alert("กรุณากรอกรหัสและชื่อนักเรียน");
            }
        };

        // 5. ฟังก์ชันลบนักเรียน
        window.deleteStudent = (id) => {
            if (confirm('ยืนยันการลบนักเรียนรหัส ' + id + '?')) {
                remove(ref(db, 'students/' + id));
            }
        };

        // 6. ฟังก์ชันเช็คชื่อ (บันทึกตามวันที่เลือก)
        window.checkAttendance = (id, name, status) => {
            const date = document.getElementById('checkDate').value;
            if (!date) return alert("กรุณาเลือกวันที่");

            set(ref(db, 'attendance/' + date + '/' + id), {
                name: name,
                status: status,
                timestamp: new Date().toLocaleTimeString()
            }).then(() => {
                alert("บันทึก " + name + " : " + status);
            });
        };

        // 7. ดึงรายชื่อนักเรียนมาแสดงผล (Real-time)
        function loadStudents() {
            onValue(ref(db, 'students'), (snapshot) => {
                const grid = document.getElementById('studentGrid');
                grid.innerHTML = '';
                const data = snapshot.val();

                if (data) {
                    Object.keys(data).forEach(id => {
                        const std = data[id];
                        grid.innerHTML += `
                            <div class="bg-[#252841] border border-gray-700 rounded-2xl p-6 relative">
                                <button onclick="deleteStudent('${id}')" class="absolute top-4 right-4 text-gray-500 hover:text-red-500">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                                <div class="flex items-center gap-4 mb-6">
                                    <div class="w-12 h-12 bg-indigo-500 rounded-full flex items-center justify-center font-bold text-xl">
                                        ${std.name.charAt(0)}
                                    </div>
                                    <div>
                                        <h3 class="font-bold">${std.name}</h3>
                                        <p class="text-sm text-gray-400">ID: ${id}</p>
                                    </div>
                                </div>
                                <div class="flex gap-2">
                                    <button onclick="checkAttendance('${id}', '${std.name}', 'มา')" class="flex-1 bg-green-600/20 text-green-400 border border-green-600/50 py-2 rounded-lg hover:bg-green-600 hover:text-white transition-all text-sm">มา</button>
                                    <button onclick="checkAttendance('${id}', '${std.name}', 'สาย')" class="flex-1 bg-yellow-600/20 text-yellow-400 border border-yellow-600/50 py-2 rounded-lg hover:bg-yellow-600 hover:text-white transition-all text-sm">สาย</button>
                                    <button onclick="checkAttendance('${id}', '${std.name}', 'ขาด')" class="flex-1 bg-red-600/20 text-red-400 border border-red-600/50 py-2 rounded-lg hover:bg-red-600 hover:text-white transition-all text-sm">ขาด</button>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    grid.innerHTML = '<p class="col-span-full text-center text-gray-500 py-10">ยังไม่มีรายชื่อนักเรียน กรุณาเพิ่มที่ช่องด้านบน</p>';
                }
            });
        }

        // ตั้งค่าวันที่เริ่มต้น
        document.getElementById('checkDate').valueAsDate = new Date();
    </script>
</body>
</html>
