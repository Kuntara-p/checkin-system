<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเช็คชื่อวิชาวิทยาศาสตร์ ป.3-ป.6</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Sarabun', sans-serif; background-color: #f0fdf4; } /* พื้นหลังเขียวอ่อน */
        .bg-science { background: linear-gradient(135deg, #166534 0%, #15803d 100%); } /* เขียวเข้มวิทย์ */
        .card-stat { transition: transform 0.2s; border-left: 5px solid #22c55e; }
        .card-stat:hover { transform: translateY(-5px); }
        .btn-status { transition: all 0.2s; border-radius: 8px; font-weight: bold; font-size: 14px; border: 1.5px solid #e5e7eb; padding: 8px 16px; }
        .active-มา { background-color: #15803d; color: white; border-color: #15803d; }
        .active-ขาด { background-color: #b91c1c; color: white; border-color: #b91c1c; }
        .active-สาย { background-color: #b45309; color: white; border-color: #b45309; }
        .active-ป่วย { background-color: #1d4ed8; color: white; border-color: #1d4ed8; }
        .active-ลา { background-color: #4338ca; color: white; border-color: #4338ca; }
        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <nav class="bg-science text-white p-4 shadow-lg no-print">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fas fa-leaf text-2xl text-lime-400"></i>
                <div>
                    <h1 class="text-xl font-bold leading-none">SCIENCE CHECK-IN</h1>
                    <p class="text-[10px] text-lime-200">ระบบบริหารจัดการเวลาเรียนวิชาวิทยาศาสตร์</p>
                </div>
            </div>
            <div class="flex gap-4 text-sm font-medium">
                <button onclick="changeGrade('P3', 'ป.3')" id="btn-P3" class="hover:text-lime-300 transition">ป.3</button>
                <button onclick="changeGrade('P4', 'ป.4')" id="btn-P4" class="hover:text-lime-300 transition">ป.4</button>
                <button onclick="changeGrade('P5', 'ป.5')" id="btn-P5" class="text-lime-400 font-bold border-b-2 border-lime-400 pb-1">ป.5</button>
                <button onclick="changeGrade('P6', 'ป.6')" id="btn-P6" class="hover:text-lime-300 transition">ป.6</button>
            </div>
        </div>
    </nav>

    <main class="container mx-auto p-6 flex-1">
        
        <div class="bg-white rounded-2xl shadow-sm p-6 mb-8 border border-green-100 flex flex-wrap justify-between items-center gap-4 no-print">
            <div class="flex items-center gap-4">
                <h2 id="titleLabel" class="text-2xl font-bold text-green-900">ประถมศึกษาปีที่ 5</h2>
                <div class="bg-green-50 px-4 py-2 rounded-xl border border-green-200 flex items-center gap-3">
                    <i class="fas fa-calendar-alt text-green-600"></i>
                    <input type="date" id="selectDate" class="bg-transparent font-bold text-green-800 outline-none">
                </div>
            </div>
            <div class="flex gap-3">
                <button onclick="document.getElementById('modalAdd').classList.remove('hidden')" class="bg-green-600 hover:bg-green-700 text-white px-5 py-2.5 rounded-xl font-bold shadow-lg shadow-green-200 transition-all">
                    <i class="fas fa-user-plus mr-2"></i>เพิ่มรายชื่อ
                </button>
                <button onclick="window.print()" class="bg-slate-800 hover:bg-slate-900 text-white px-5 py-2.5 rounded-xl font-bold shadow-lg transition-all">
                    <i class="fas fa-file-pdf mr-2"></i>พิมพ์รายงาน
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8 no-print">
            <div class="card-stat bg-white p-5 rounded-2xl shadow-sm">
                <p class="text-xs font-bold text-slate-400 uppercase">นักเรียนทั้งหมด</p>
                <h3 id="countTotal" class="text-3xl font-bold text-slate-800">0</h3>
            </div>
            <div class="card-stat bg-white p-5 rounded-2xl shadow-sm border-l-green-500">
                <p class="text-xs font-bold text-green-500 uppercase">มาเรียนวันนี้</p>
                <h3 id="countPresent" class="text-3xl font-bold text-green-600">0</h3>
            </div>
            <div class="card-stat bg-white p-5 rounded-2xl shadow-sm border-l-rose-500">
                <p class="text-xs font-bold text-rose-500 uppercase">ขาดเรียน</p>
                <h3 id="countAbsent" class="text-3xl font-bold text-rose-600">0</h3>
            </div>
            <div class="card-stat bg-white p-5 rounded-2xl shadow-sm border-l-amber-500">
                <p class="text-xs font-bold text-amber-500 uppercase">ลา/สาย/ป่วย</p>
                <h3 id="countOther" class="text-3xl font-bold text-amber-600">0</h3>
            </div>
        </div>

        <div class="bg-white rounded-3xl shadow-xl overflow-hidden border border-green-100">
            <div class="bg-green-50 p-4 border-b border-green-100 font-bold text-green-800">
                <i class="fas fa-clipboard-list mr-2"></i>บัญชีลงเวลาเรียนวิชาวิทยาศาสตร์
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-slate-50 text-slate-500 text-sm">
                        <tr>
                            <th class="p-4 border-b text-center w-20">เลขที่</th>
                            <th class="p-4 border-b text-center w-32">รหัสประจำตัว</th>
                            <th class="p-4 border-b">ชื่อ - นามสกุล</th>
                            <th class="p-4 border-b text-center w-[450px]">สถานะการเข้าเรียน</th>
                            <th class="p-4 border-b text-center w-20 no-print">จัดการ</th>
                        </tr>
                    </thead>
                    <tbody id="studentTableBody" class="divide-y divide-slate-100">
                        </tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="modalAdd" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl p-8 w-full max-w-sm shadow-2xl">
            <h3 class="text-2xl font-bold mb-6 text-green-900 border-b border-green-100 pb-2">บันทึกนักเรียนใหม่</h3>
            <div class="space-y-4">
                <input type="number" id="mNo" placeholder="เลขที่" class="w-full border p-3 rounded-xl outline-none focus:ring-2 focus:ring-green-500">
                <input type="text" id="mId" placeholder="รหัสประจำตัว" class="w-full border p-3 rounded-xl outline-none focus:ring-2 focus:ring-green-500">
                <select id="mPrefix" class="w-full border p-3 rounded-xl bg-white outline-none">
                    <option value="เด็กชาย">เด็กชาย</option>
                    <option value="เด็กหญิง">เด็กหญิง</option>
                </select>
                <input type="text" id="mName" placeholder="ชื่อ-นามสกุล" class="w-full border p-3 rounded-xl outline-none focus:ring-2 focus:ring-green-500">
                <div class="flex gap-3 pt-4">
                    <button id="saveBtn" class="flex-1 bg-green-600 text-white py-3 rounded-2xl font-bold shadow-lg hover:bg-green-700">บันทึก</button>
                    <button onclick="document.getElementById('modalAdd').classList.add('hidden')" class="flex-1 bg-slate-100 py-3 rounded-2xl font-bold">ยกเลิก</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCaAWoyfgWqBx8OiJLKuIOMmy602Y3cb9Q",
            authDomain: "mycheckin-ba316.firebaseapp.com",
            databaseURL: "https://mycheckin-ba316-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "mycheckin-ba316",
            storageBucket: "mycheckin-ba316.firebasestorage.app",
            appId: "1:70860501032:web:6cf057afbdd8330048451d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentGrade = 'P5';
        let gradeName = 'ประถมศึกษาปีที่ 5';
        const dateInput = document.getElementById('selectDate');
        dateInput.valueAsDate = new Date();

        window.changeGrade = (g, n) => {
            currentGrade = g; gradeName = 'ประถมศึกษาปีที่ ' + n;
            document.querySelectorAll('.hover\\:text-lime-300').forEach(b => b.classList.remove('text-lime-400', 'font-bold', 'border-b-2', 'border-lime-400'));
            document.getElementById('btn-'+g).classList.add('text-lime-400', 'font-bold', 'border-b-2', 'border-lime-400');
            document.getElementById('titleLabel').innerText = gradeName;
            loadData();
        };

        document.getElementById('saveBtn').onclick = async () => {
            const no = document.getElementById('mNo').value;
            const id = document.getElementById('mId').value;
            const name = document.getElementById('mPrefix').value + document.getElementById('mName').value;
            if(no && name) {
                await set(ref(db, `school/${currentGrade}/students/${no}`), { id, name });
                document.getElementById('modalAdd').classList.add('hidden');
                alert('บันทึกสำเร็จ!');
            }
        };

        window.updateStatus = async (no, status) => {
            const date = dateInput.value;
            await set(ref(db, `school/${currentGrade}/attendance/${date}/${no}`), status);
        };

        window.deleteStd = (no) => {
            if(confirm('ลบรายชื่อเลขที่ ' + no + '?')) remove(ref(db, `school/${currentGrade}/students/${no}`));
        };

        function loadData() {
            const date = dateInput.value;
            onValue(ref(db, `school/${currentGrade}`), (snap) => {
                const data = snap.val() || {};
                const students = data.students || {};
                const attendance = (data.attendance && data.attendance[date]) || {};
                const tbody = document.getElementById('studentTableBody');
                tbody.innerHTML = '';

                let pres=0, abs=0, oth=0;

                Object.keys(students).sort((a,b)=>a-b).forEach(no => {
                    const s = students[no];
                    const status = attendance[no] || '';
                    if(status==='มา') pres++; else if(status==='ขาด') abs++; else if(status!=='') oth++;

                    tbody.innerHTML += `
                        <tr class="hover:bg-green-50 transition-all border-b border-slate-50">
                            <td class="p-4 text-center font-bold text-slate-700">${no}</td>
                            <td class="p-4 text-center text-slate-400 text-xs">${s.id || '-'}</td>
                            <td class="p-4 font-bold text-slate-800">${s.name}</td>
                            <td class="p-4">
                                <div class="flex justify-center gap-2">
                                    <button onclick="updateStatus('${no}', 'มา')" class="btn-status ${status==='มา'?'active-มา':''}"><i class="fas fa-check mr-1"></i>มา</button>
                                    <button onclick="updateStatus('${no}', 'ขาด')" class="btn-status ${status==='ขาด'?'active-ขาด':''}"><i class="fas fa-times mr-1"></i>ขาด</button>
                                    <button onclick="updateStatus('${no}', 'สาย')" class="btn-status ${status==='สาย'?'active-สาย':''}"><i class="fas fa-clock mr-1"></i>สาย</button>
                                    <button onclick="updateStatus('${no}', 'ป่วย')" class="btn-status ${status==='ป่วย'?'active-ป่วย':''}"><i class="fas fa-heart mr-1"></i>ป่วย</button>
                                    <button onclick="updateStatus('${no}', 'ลา')" class="btn-status ${status==='ลา'?'active-ลา':''}"><i class="fas fa-file-alt mr-1"></i>ลา</button>
                                </div>
                            </td>
                            <td class="p-4 text-center no-print">
                                <button onclick="deleteStd('${no}')" class="text-slate-300 hover:text-red-500"><i class="fas fa-trash-alt"></i></button>
                            </td>
                        </tr>
                    `;
                });
                document.getElementById('countTotal').innerText = Object.keys(students).length;
                document.getElementById('countPresent').innerText = pres;
                document.getElementById('countAbsent').innerText = abs;
                document.getElementById('countOther').innerText = oth;
            });
        }

        dateInput.onchange = loadData;
        loadData();
    </script>
</body>
</html>
