<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCIENCE SMART SYSTEM - BAN KHUAN NIANG SCHOOL V28</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Sarabun', sans-serif; background-color: #f0fdf4; }
        .report-table { border-collapse: collapse; width: 100%; table-layout: fixed; font-size: 9px; border: 1px solid black; background: white; }
        .report-table th, .report-table td { border: 1px solid black; padding: 2px 0; text-align: center; height: 18px; color: black; }
        .day-col { width: 20px !important; }
        .no-col { width: 30px !important; }
        .name-col { width: 170px !important; text-align: left !important; padding-left: 5px !important; }
        .holiday-cell { background-color: #94a3b8 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        @media print {
            .no-print { display: none !important; }
            body { background: white; padding: 0; margin: 0; }
            .print-area { display: block !important; width: 297mm; padding: 10mm; }
            @page { size: A4 landscape; margin: 5mm; }
        }
        .nav-tab.active { background-color: white; color: #15803d; border-radius: 8px 8px 0 0; font-weight: bold; border-top: 4px solid #15803d; }
        .btn-locked { opacity: 0.3; cursor: not-allowed; pointer-events: none !important; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="bg-green-800 text-white no-print shadow-lg">
        <div class="container mx-auto px-4 pt-4">
            <div class="flex items-center gap-3 mb-4">
                <i class="fas fa-microscope text-2xl text-lime-400"></i>
                <h1 class="text-xl font-bold uppercase tracking-wide">Science Smart System V28</h1>
            </div>
            <div class="flex gap-2">
                <button onclick="showView('checkin')" id="tab-checkin" class="nav-tab active px-6 py-2 text-sm transition-all">เช็คเวลาเรียน</button>
                <button onclick="showView('report')" id="tab-report" class="nav-tab px-6 py-2 text-sm transition-all">รายงานรายเดือน</button>
                <button onclick="showView('summary')" id="tab-summary" class="nav-tab px-6 py-2 text-sm transition-all">สรุปรายภาคเรียน</button>
                <button onclick="showView('settings')" id="tab-settings" class="nav-tab px-6 py-2 text-sm transition-all text-yellow-300"><i class="fas fa-cog mr-1"></i>ตั้งค่า</button>
            </div>
        </div>
    </header>

    <main id="view-checkin" class="container mx-auto p-4 md:p-6 flex-1 no-print">
        <div class="bg-white rounded-3xl shadow-sm p-6 mb-2 border border-green-100 flex flex-wrap justify-between items-end gap-4 shadow-xl">
            <div class="flex flex-wrap items-center gap-4">
                <div class="flex flex-col"><label class="text-xs text-slate-400 font-bold mb-1">ปีการศึกษา</label><select id="mainYear" onchange="loadData()" class="bg-green-50 border border-green-200 p-2.5 rounded-xl font-bold text-green-800 outline-none"><option>2569</option><option>2570</option></select></div>
                <div class="flex flex-col"><label class="text-xs text-slate-400 font-bold mb-1">ภาคเรียน</label><select id="mainTerm" onchange="loadData()" class="bg-green-50 border border-green-200 p-2.5 rounded-xl font-bold text-green-800 outline-none"><option>1</option><option>2</option></select></div>
                <div class="flex flex-col"><label class="text-xs text-slate-400 font-bold mb-1">ระดับชั้น</label><select id="gradeSelect" onchange="loadData()" class="bg-green-50 border border-green-200 p-2.5 rounded-xl font-bold text-green-800"><option value="P3">ป.3</option><option value="P4">ป.4</option><option value="P5" selected>ป.5</option><option value="P6">ป.6</option></select></div>
                <div class="flex flex-col"><label class="text-xs text-slate-400 font-bold mb-1">เลือกวันที่</label><input type="date" id="selectDate" onchange="loadData()" class="bg-green-50 border border-green-200 p-2.5 rounded-xl font-bold text-green-800 outline-none"></div>
            </div>
            <div class="flex flex-wrap gap-2">
                <button onclick="setTermDates()" class="bg-blue-600 text-white px-4 py-2 rounded-xl font-bold shadow-md hover:bg-blue-700 text-xs">กำหนดเปิด-ปิดเทอม</button>
                <button onclick="toggleNoClass()" id="btnNoClass" class="bg-purple-600 text-white px-4 py-2 rounded-xl font-bold shadow-md hover:bg-purple-700 text-xs">ไม่มีคาบเรียน</button>
                <button onclick="toggleHoliday()" id="btnHoliday" class="bg-orange-500 text-white px-4 py-2 rounded-xl font-bold shadow-md hover:bg-orange-600 text-xs">กำหนดวันหยุด</button>
                <button onclick="toggleAllPresent()" id="btnAll" class="bg-green-600 text-white px-4 py-2 rounded-xl font-bold shadow-md hover:bg-green-700 text-xs">มาทุกคน</button>
                <button onclick="document.getElementById('modalImport').classList.remove('hidden')" class="bg-amber-500 text-white px-4 py-2 rounded-xl font-bold shadow-md text-xs">นำเข้า Excel</button>
            </div>
        </div>
        <div id="termInfoText" class="mb-4 text-xs font-bold text-blue-700 px-4"></div>
        <div id="holidayLabel" class="hidden mb-4 p-4 bg-red-100 text-red-700 rounded-2xl border-l-8 border-red-500 font-bold text-center"></div>
        
        <div class="bg-white rounded-3xl shadow-xl overflow-hidden border border-green-100">
            <table class="w-full text-left">
                <thead class="bg-green-800 text-white text-center"><tr><th class="p-4 w-16">ที่</th><th>ชื่อ - นามสกุล (ชื่อเล่น)</th><th class="w-1/2">สถานะการมาเรียนวันนี้</th><th class="w-16">ลบ</th></tr></thead>
                <tbody id="studentTableBody" class="divide-y divide-slate-100"></tbody>
            </table>
            <div class="p-6 bg-slate-50 border-t flex justify-center"><button onclick="deleteAllStudents()" class="bg-red-500 hover:bg-red-700 text-white px-8 py-3 rounded-2xl font-bold shadow-lg flex items-center gap-2 text-sm"><i class="fas fa-trash-alt"></i> ลบรายชื่อทั้งหมดในห้องนี้</button></div>
        </div>
    </main>

    <main id="view-report" class="container mx-auto p-4 md:p-6 flex-1 no-print hidden">
        <div class="bg-white rounded-3xl shadow-lg p-8 border border-green-100">
            <h2 class="text-2xl font-bold text-green-800 mb-6 flex items-center gap-2"><i class="fas fa-file-invoice text-yellow-500"></i> รายงานรายเดือน</h2>
            <div class="grid grid-cols-1 md:flex flex-wrap gap-4 bg-slate-50 p-6 rounded-2xl border mb-8 items-end">
                <div class="flex-1"><label class="text-xs font-bold mb-2 block text-slate-500">เลือกเดือน/ปี</label><input type="month" id="reportMonth" class="w-full border p-3 rounded-xl"></div>
                <div class="flex gap-2"><button onclick="generateReport()" class="bg-purple-600 text-white p-3 rounded-xl font-bold px-8 shadow-md">ค้นหา</button><button onclick="window.print()" id="btnPrint" class="hidden bg-rose-600 text-white p-3 rounded-xl font-bold px-8 shadow-md">พิมพ์ PDF</button></div>
            </div>
            <div id="reportPreview" class="overflow-x-auto p-4 bg-white rounded-xl border min-h-[400px]"></div>
        </div>
    </main>

    <main id="view-summary" class="container mx-auto p-4 flex-1 no-print hidden">
        <div class="bg-white rounded-3xl shadow-xl p-8 border-t-8 border-green-600">
            <h2 class="text-2xl font-bold text-green-800 mb-6 text-center">สรุปสถิติการมาเรียนรายภาคเรียน</h2>
            <div class="flex justify-center mb-8"><button onclick="loadSummary()" class="bg-green-700 text-white p-3 rounded-xl font-bold px-12 shadow-md hover:bg-green-800">ดึงข้อมูลสรุป</button></div>
            <div class="overflow-x-auto"><table class="w-full border-collapse border border-slate-200"><thead class="bg-green-800 text-white"><tr><th class="p-3 border">ที่</th><th class="p-3 border text-left">ชื่อ-นามสกุล</th><th class="p-3 border">มา</th><th class="p-3 border text-blue-200">ลา</th><th class="p-3 border text-red-200">ขาด</th><th class="p-3 border text-amber-200">สาย</th><th class="p-3 border bg-yellow-400 text-green-900 font-bold">%</th></tr></thead><tbody id="summaryTableBody" class="divide-y font-bold text-center bg-white"></tbody></table></div>
        </div>
    </main>

    <main id="view-settings" class="container mx-auto p-4 md:p-6 flex-1 no-print hidden">
        <div class="bg-white rounded-3xl shadow-xl p-8 border border-green-100 max-w-2xl mx-auto">
            <h2 class="text-2xl font-bold text-green-800 mb-6 border-b pb-4"><i class="fas fa-user-edit mr-2"></i>ข้อมูลครูและโรงเรียน</h2>
            <div class="space-y-6">
                <div><label class="block text-xs font-bold text-slate-500 mb-2">ชื่อครูประจำชั้นคนที่ 1</label><input type="text" id="teacher1" class="w-full border p-3 rounded-xl outline-none focus:ring-2 focus:ring-green-500" placeholder="เช่น นายวิทยาศาสตร์ ใจดี"></div>
                <div><label class="block text-xs font-bold text-slate-500 mb-2">ชื่อครูประจำชั้นคนที่ 2 (ถ้ามี)</label><input type="text" id="teacher2" class="w-full border p-3 rounded-xl outline-none focus:ring-2 focus:ring-green-500" placeholder="ระบุชื่อ"></div>
                <div><label class="block text-xs font-bold text-slate-500 mb-2">ชื่อผู้อำนวยการโรงเรียน</label><input type="text" id="directorName" class="w-full border p-3 rounded-xl outline-none focus:ring-2 focus:ring-green-500" placeholder="ระบุชื่อผู้อำนวยการ"></div>
                <div><label class="block text-xs font-bold text-slate-500 mb-2">กลุ่มสาระการเรียนรู้</label><input type="text" id="department" class="w-full border p-3 rounded-xl outline-none focus:ring-2 focus:ring-green-500" placeholder="เช่น กลุ่มสาระการเรียนรู้วิทยาศาสตร์และเทคโนโลยี"></div>
                <button onclick="saveSettings()" class="w-full bg-green-600 text-white py-4 rounded-2xl font-bold shadow-xl hover:bg-green-700 transition-all">บันทึกข้อมูลตั้งค่า</button>
            </div>
        </div>
    </main>

    <div id="modalAdd" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50 no-print">
        <div class="bg-white rounded-3xl p-8 w-full max-w-sm"><h3 class="text-xl font-bold mb-4">เพิ่มรายคน</h3><input type="number" id="mNo" placeholder="เลขที่" class="w-full border p-3 rounded-xl mb-2"><input type="text" id="mName" placeholder="ชื่อ-สกุล" class="w-full border p-3 rounded-xl mb-2"><input type="text" id="mNick" placeholder="ชื่อเล่น" class="w-full border p-3 rounded-xl mb-4"><div class="flex gap-2"><button onclick="saveSingleStudent()" class="flex-1 bg-green-600 text-white py-3 rounded-xl font-bold">บันทึก</button><button onclick="document.getElementById('modalAdd').classList.add('hidden')" class="flex-1 bg-slate-100 py-3 rounded-xl font-bold">ปิด</button></div></div>
    </div>
    <div id="modalImport" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50 no-print">
        <div class="bg-white rounded-3xl p-8 w-full max-w-2xl"><h3 class="text-xl font-bold mb-4">นำเข้า Excel</h3><textarea id="importArea" rows="10" class="w-full border p-4 rounded-xl font-mono text-sm mb-4" placeholder="เลขที่ ชื่อจริง ชื่อเล่น"></textarea><div class="flex gap-2"><button onclick="processImport()" class="flex-1 bg-amber-500 text-white py-3 rounded-xl font-bold">บันทึกทั้งหมด</button><button onclick="document.getElementById('modalImport').classList.add('hidden')" class="flex-1 bg-slate-100 py-3 rounded-xl">ปิด</button></div></div>
    </div>

    <div id="printArea" class="hidden print-area"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCaAWoyfgWqBx8OiJLKuIOMmy602Y3cb9Q",
            authDomain: "mycheckin-ba316.firebaseapp.com",
            databaseURL: "https://mycheckin-ba316-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "mycheckin-ba316",
            storageBucket: "mycheckin-ba316.firebasestorage.app",
            messagingSenderId: "70860501032",
            appId: "1:70860501032:web:6cf057afbdd8330048451d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const dateInput = document.getElementById('selectDate');
        dateInput.valueAsDate = new Date();
        document.getElementById('reportMonth').value = new Date().toISOString().substring(0, 7);

        window.showView = (view) => {
            ['checkin', 'report', 'summary', 'settings'].forEach(v => {
                document.getElementById('view-'+v).classList.toggle('hidden', v !== view);
                document.getElementById('tab-'+v).classList.toggle('active', v === view);
            });
            if(view === 'settings') loadSettings();
        };

        const getBaseRef = () => `school/${document.getElementById('gradeSelect').value}/${document.getElementById('mainYear').value}/${document.getElementById('mainTerm').value}`;

        window.loadData = () => {
            onValue(ref(db, getBaseRef()), (snap) => {
                const data = snap.val() || {}, students = data.students || {}, attendance = (data.attendance && data.attendance[dateInput.value]) || {}, termDates = data.termDates || {}, holidays = data.holidays || {};
                const d = new Date(dateInput.value); const isWeekend = (d.getDay() === 0 || d.getDay() === 6);
                let isTermActive = termDates.start ? (dateInput.value >= termDates.start && dateInput.value <= termDates.end) : false;
                
                const labelH = document.getElementById('holidayLabel'); const area = document.getElementById('studentTableBody');
                const isNoClass = (holidays[dateInput.value] === "ไม่มีคาบเรียน");
                document.getElementById('btnNoClass').innerText = isNoClass ? 'มีคาบเรียนปกติ' : 'ไม่มีคาบเรียน';
                document.getElementById('btnNoClass').classList.toggle('bg-red-700', isNoClass);

                // ระบบล็อกการเช็คชื่อเมื่อไม่มีคาบเรียนหรือวันหยุด
                if(holidays[dateInput.value]) {
                    labelH.innerText = (holidays[dateInput.value] === "ไม่มีคาบเรียน") ? "📅 วันนี้ไม่มีคาบเรียน (ไม่สามารถเช็คชื่อได้)" : `[ วันหยุดพิเศษ ] : ${holidays[dateInput.value]}`;
                    labelH.classList.remove('hidden'); area.classList.add('btn-locked');
                } else if(isWeekend || !isTermActive) {
                    labelH.innerText = isWeekend ? "⚠️ วันเสาร์-อาทิตย์ ไม่สามารถเช็คชื่อได้" : "⚠️ อยู่นอกช่วงภาคเรียน ไม่สามารถเช็คชื่อได้";
                    labelH.classList.remove('hidden'); area.classList.add('btn-locked');
                } else { labelH.classList.add('hidden'); area.classList.remove('btn-locked'); }

                document.getElementById('termInfoText').innerText = termDates.start ? `📍 ภาคเรียนปัจจุบัน: ${termDates.start} ถึง ${termDates.end}` : "⚠️ ยังไม่ได้กำหนดเปิด-ปิดเทอม";
                const presentCount = Object.values(attendance).filter(v => v === 'มา').length;
                document.getElementById('btnAll').innerText = (presentCount > 0 && presentCount === Object.keys(students).length) ? 'ยกเลิกทุกคน' : 'มาทุกคน';
                
                const tbody = document.getElementById('studentTableBody'); tbody.innerHTML = '';
                Object.keys(students).sort((a,b)=>a-b).forEach(no => {
                    const st = attendance[no] || '', s = students[no];
                    tbody.innerHTML += `<tr class="hover:bg-green-50 border-b"><td class="p-4 text-center font-bold text-slate-700">${no}</td><td class="p-4 font-bold text-slate-800">${s.name} <small class="text-blue-500">(${s.nickname||''})</small></td><td class="p-4 text-center"><div class="flex justify-center gap-1"><button onclick="updateStatus('${no}', 'มา')" class="px-5 py-1.5 rounded-xl border-2 ${st==='มา'?'bg-green-600 text-white border-green-600':'bg-white text-green-600 border-green-100'}">มา</button><button onclick="updateStatus('${no}', 'ขาด')" class="px-5 py-1.5 rounded-xl border-2 ${st==='ขาด'?'bg-red-600 text-white border-red-600':'bg-white text-red-100 border-red-100'}">ขาด</button><button onclick="updateStatus('${no}', 'ลา')" class="px-5 py-1.5 rounded-xl border-2 ${st==='ลา'?'bg-blue-600 text-white border-blue-600':'bg-white text-blue-100 border-blue-100'}">ลา</button><button onclick="updateStatus('${no}', 'สาย')" class="px-5 py-1.5 rounded-xl border-2 ${st==='สาย'?'bg-amber-500 text-white border-amber-500':'bg-white text-amber-100 border-amber-100'}">สาย</button></div></td><td class="p-4 text-center"><button onclick="removeStudent('${no}')" class="text-slate-300 hover:text-red-500"><i class="fas fa-trash"></i></button></td></tr>`;
                });
            });
        };

        window.toggleNoClass = async () => {
            const path = `${getBaseRef()}/holidays/${dateInput.value}`;
            onValue(ref(db, path), async (snap) => {
                if(snap.val() === "ไม่มีคาบเรียน") await remove(ref(db, path));
                else await set(ref(db, path), "ไม่มีคาบเรียน");
            }, { onlyOnce: true });
        };

        window.generateReport = () => {
            const y = document.getElementById('repYear').value, t = document.getElementById('repTerm').value, g = document.getElementById('reportGrade').value;
            const [year, month] = document.getElementById('reportMonth').value.split('-');
            const daysInMonth = new Date(year, month, 0).getDate();
            const monthNames = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
            
            onValue(ref(db, `school/${g}/${y}/${t}`), (snap) => {
                const data = snap.val() || {}, students = data.students || {}, attendance = data.attendance || {}, holidays = data.holidays || {}, termDates = data.termDates || {}, settings = data.settings || {};
                let rows = ''; let activeDaysTotal = 0;
                for(let d=1; d<=daysInMonth; d++) {
                    const ds = `${year}-${month}-${String(d).padStart(2,'0')}`, dt = new Date(year, month-1, d);
                    const isWeekend = (dt.getDay() === 0 || dt.getDay() === 6);
                    if(!isWeekend && !holidays[ds] && ds>=termDates.start && ds<=termDates.end) activeDaysTotal++;
                }
                Object.keys(students).sort((a,b)=>a-b).forEach((no, idx) => {
                    let dCells = ''; let s = { มา: 0, สาย: 0, ลา: 0, ขาด: 0 };
                    for(let d=1; d<=daysInMonth; d++) {
                        const ds = `${year}-${month}-${String(d).padStart(2,'0')}`, dt = new Date(year, month-1, d);
                        if(dt.getDay() === 0 || dt.getDay() === 6 || holidays[ds]) dCells += `<td class="holiday-cell"></td>`;
                        else {
                            const st = (attendance[ds] && attendance[ds][no]) || '';
                            if(st==='มา'){ dCells += `<td>/</td>`; s.มา++; } else if(st==='ลา'){ dCells += `<td>ล</td>`; s.ลา++; } else if(st==='ขาด'){ dCells += `<td>ข</td>`; s.ขาด++; } else if(st==='สาย'){ dCells += `<td>ส</td>`; s.สาย++; } else dCells += `<td></td>`;
                        }
                    }
                    const per = activeDaysTotal > 0 ? ((s.มา/activeDaysTotal)*100).toFixed(0) : '0';
                    rows += `<tr><td>${idx+1}</td><td class="name-col font-bold">${students[no].name}</td>${dCells}<td>${s.มา}</td><td>${s.สาย}</td><td>${s.ลา}</td><td>${s.ขาด}</td><td class="font-bold">${per}%</td></tr>`;
                });
                const html = `<div style="text-align:center;"><img src="https://upload.wikimedia.org/wikipedia/commons/b/b8/Seal_of_the_Office_of_the_Basic_Education_Commission.png" style="width:40px; margin-bottom:5px;"><h2 style="font-size:16px; font-weight:bold; margin:0;">โรงเรียนบ้านควนเนียง</h2><p style="font-size:12px; margin:2px;">แบบบันทึกการมาเรียน ประจำเดือน ${monthNames[month-1]} พุทธศักราช ${parseInt(year)+543}</p><p style="font-size:10px; margin-bottom:10px;">ชั้นเรียน: ${document.getElementById('reportGrade').options[document.getElementById('reportGrade').selectedIndex].text} | ${settings.department || 'กลุ่มสาระวิทยาศาสตร์'} | ปีการศึกษา: ${y}</p><table class="report-table"><thead><tr><th rowspan="2" class="no-col">ที่</th><th rowspan="2" class="name-col">ชื่อ-สกุล</th><th colspan="${daysInMonth}">วันที่</th><th colspan="4" style="width:100px;">สรุป</th><th rowspan="2" class="percent-col">%</th></tr><tr>${Array.from({length:daysInMonth}, (_, i) => `<th class="day-col">${i+1}</th>`).join('')}<th class="stat-col">มา</th><th class="stat-col">สาย</th><th class="stat-col">ลา</th><th class="stat-col">ขาด</th></tr></thead><tbody>${rows}</tbody></table><div style="text-align:left; font-size:9px; margin-top:10px;">สัญลักษณ์: / = มา, ส = สาย, ล = ลา, ข = ขาด, [สีเทา] = หยุด/ไม่มีคาบ | ครูประจำชั้น: ${settings.teacher1 || '....................'} และ ${settings.teacher2 || '....................'}</div></div>`;
                document.getElementById('reportPreview').innerHTML = html; document.getElementById('printArea').innerHTML = html; document.getElementById('btnPrint').classList.remove('hidden');
            });
        };

        window.saveSettings = async () => {
            const data = { teacher1: document.getElementById('teacher1').value, teacher2: document.getElementById('teacher2').value, directorName: document.getElementById('directorName').value, department: document.getElementById('department').value };
            await set(ref(db, `${getBaseRef()}/settings`), data); alert("บันทึกการตั้งค่าเรียบร้อย!");
        };

        function loadSettings() {
            onValue(ref(db, `${getBaseRef()}/settings`), (snap) => {
                const s = snap.val() || {};
                document.getElementById('teacher1').value = s.teacher1 || '';
                document.getElementById('teacher2').value = s.teacher2 || '';
                document.getElementById('directorName').value = s.directorName || '';
                document.getElementById('department').value = s.department || '';
            }, { onlyOnce: true });
        }

        window.updateStatus = async (no, status) => { const currentRef = ref(db, `${getBaseRef()}/attendance/${dateInput.value}/${no}`); onValue(currentRef, async (snap) => { await set(currentRef, snap.val() === status ? null : status); }, { onlyOnce: true }); };
        window.toggleAllPresent = async () => { const isCancel = document.getElementById('btnAll').innerText.includes("ยกเลิก"); onValue(ref(db, `${getBaseRef()}/students`), async (snap) => { const students = snap.val() || {}, updates = {}; Object.keys(students).forEach(no => updates[`${getBaseRef()}/attendance/${dateInput.value}/${no}`] = isCancel ? null : 'มา'); await update(ref(db), updates); }, { onlyOnce: true }); };
        window.setTermDates = async () => { const start = prompt("เปิดเทอม (ปปปป-ดด-วว):", "2026-05-15"), end = prompt("ปิดเทอม (ปปปป-ดด-วว):", "2026-10-10"); if(start && end) await set(ref(db, `${getBaseRef()}/termDates`), { start, end }); };
        window.toggleHoliday = async () => { const path = `${getBaseRef()}/holidays/${dateInput.value}`; onValue(ref(db, path), async (snap) => { if(!snap.val()) { const reason = prompt("วันหยุดเนื่องจาก:"); if(reason) await set(ref(db, path), reason); } else { if(confirm("ยกเลิกวันหยุด?")) await remove(ref(db, path)); } }, { onlyOnce: true }); };
        window.loadSummary = () => { onValue(ref(db, getBaseRef()), (snap) => { const data = snap.val() || {}, termDates = data.termDates || {}, students = data.students || {}, attendance = data.attendance || {}, holidays = data.holidays || {}; if(!termDates.start) return; let schoolDays = 0; const startDate = new Date(termDates.start); const endDate = new Date(termDates.end); for(let d=new Date(startDate); d<=endDate; d.setDate(d.getDate()+1)) { const ds = d.toISOString().split('T')[0]; if(d.getDay()!==0 && d.getDay()!==6 && !holidays[ds]) schoolDays++; } const tbody = document.getElementById('summaryTableBody'); tbody.innerHTML = ''; Object.keys(students).sort((a,b)=>a-b).forEach(no => { let s = { มา: 0, ลา: 0, สาย: 0, ขาด: 0 }; Object.keys(attendance).forEach(date => { if(date >= termDates.start && date <= termDates.end) { const st = attendance[date][no]; if(st) s[st]++; } }); const per = schoolDays > 0 ? ((s.มา/schoolDays)*100).toFixed(1) : '0'; tbody.innerHTML += `<tr><td class="p-3 border">${no}</td><td class="p-3 border text-left font-bold">${students[no].name}</td><td class="p-3 border">${s.มา}</td><td class="p-3 border text-blue-600">${s.ลา}</td><td class="p-3 border text-red-600">${s.ขาด}</td><td class="p-3 border text-amber-600">${s.สาย}</td><td class="p-3 border bg-yellow-50 text-green-900">${per}%</td></tr>`; }); }); };
        window.processImport = async () => { const raw = document.getElementById('importArea').value.trim(); if(!raw) return; const updates = {}; const path = getBaseRef(); raw.split('\n').forEach(line => { const p = line.trim().split(/\s+/); if (p.length >= 2) updates[`${path}/students/${p[0]}`] = { name: p.slice(1, p.length > 2 ? -1 : undefined).join(' '), nickname: p.length > 2 ? p[p.length - 1] : '' }; }); await update(ref(db), updates); document.getElementById('modalImport').classList.add('hidden'); };
        window.saveSingleStudent = async () => { const no = document.getElementById('mNo').value, name = document.getElementById('mName').value, nick = document.getElementById('mNick').value; if(no && name) { await set(ref(db, `${getBaseRef()}/students/${no}`), { name, nickname: nick }); document.getElementById('modalAdd').classList.add('hidden'); } };
        window.removeStudent = (no) => { if(confirm('ลบ?')) remove(ref(db, `${getBaseRef()}/students/${no}`)); };
        window.deleteAllStudents = () => { if(confirm('ลบรายชื่อทั้งหมดในห้อง?')) remove(ref(db, `${getBaseRef()}/students`)); };
        loadData();
    </script>
</body>
</html>
